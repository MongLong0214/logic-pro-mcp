name: Live QA failure
description: Capture a failure found during real Logic Pro testing, demo production, or live E2E.
title: "Live QA: "
labels: ["bug", "area: demo", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when a real Logic Pro session, demo transcript, or live E2E run exposes uncertain or failed behavior.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I checked whether this is already covered by an existing issue.
          required: true
        - label: I separated product behavior from demo/rendering artifacts.
          required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - unsafe write, data loss, or destructive wrong target
        - P1 - public claim, core workflow, or verified-state blocker
        - P2 - important live gap with workaround
        - P3 - low-risk demo or diagnostic gap
    validations:
      required: true

  - type: textarea
    id: live_context
    attributes:
      label: Live context
      placeholder: |
        - Date/time:
        - Logic Pro version:
        - Project/session state:
        - Capture or E2E script:
        - Transcript/provenance path:
        - Related media artifact:
    validations:
      required: true

  - type: dropdown
    id: state
    attributes:
      label: Observed outcome
      options:
        - State B - uncertain success
        - State C - hard failure
        - Mismatch between response and live UI/resource
        - Public evidence boundary problem
        - Unknown, needs triage
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed evidence
      description: Include exact response snippets, resource readback, transcript entries, or artifact paths.
    validations:
      required: true

  - type: textarea
    id: user_claim_risk
    attributes:
      label: Claim boundary
      placeholder: |
        Until this is fixed, do not claim...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      placeholder: |
        - [ ] Failure is reproduced or documented as unsupported.
        - [ ] State A is returned only with readback evidence.
        - [ ] Public demo/docs avoid unverified claims.
    validations:
      required: true

  - type: textarea
    id: logic_canon
    attributes:
      label: Logic canon
      description: |
        Optional. Fill this in if you can; an advisory bot comments here when it finds nothing,
        and a maintainer can help either way. Nothing about this field blocks the issue.

        Whichever of these fits:

        1. You have a reference. Paste it with the value it resolves to, from
           `Scripts/logic_canon.py resolve <ref>`, and say what it supports.
        2. You saw it but have no reference. Describe the observation and where you made it --
           Logic version, locale, machine. Mapping it to the corpus is a maintainer's job, not
           yours; you do not need the corpus build to report a problem.
        3. This issue claims nothing about Logic at all -- packaging, docs, process. Write the
           sentence `states no fact about Logic` and a one-line reason.

        Write that sentence as ordinary text. A declaration that appears only inside a code
        fence or an HTML comment is deliberately not read, so a fenced one does not count.
      placeholder: |
        logic-canon://<source>/<unit>/<locale>/<key>#<field>
          value:    ...
          used for: ...

        or: what I saw, in Logic <version>, locale <xx-XX>, on <machine>
    validations:
      required: false
