name: Validate Cursor MCP config

on:
  push:
    branches: [main]
    paths:
      - .cursor/mcp.json
      - server.json
      - Scripts/mcp-prove-connection.sh
      - logic_mcp_proxy.py
  pull_request:
    paths:
      - .cursor/mcp.json
      - server.json
      - Scripts/mcp-prove-connection.sh
      - logic_mcp_proxy.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate project MCP JSON
        run: python3 -m json.tool .cursor/mcp.json

      - name: Registry metadata (mcp-publisher)
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
        run: |
          set -euo pipefail
          asset=mcp-publisher_linux_amd64.tar.gz
          sha256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          curl -fsSLo "$asset" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}"
          echo "${sha256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher validate

      - name: Linux MCP prove script
        run: bash Scripts/mcp-prove-connection.sh