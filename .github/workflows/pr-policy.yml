name: PR policy

# The pull request BODY, checked on its own schedule -- and, since 2026-09-22, the only gate that
# subscribes to `edited` at all.
#
# WHY IT IS A SEPARATE WORKFLOW
# -----------------------------
# The body gate needs `edited`, because the defect it exists for is: open a compliant pull request,
# let it go green, then edit the citations out. `edited` is not in the default event set, so
# `ci.yml` listed it too -- and `build` refuses a dependency whose result is `skipped`, so
# narrowing it with an `if:` on compile and test would turn the only required context red on every
# edit. The result was that changing a pull request's DESCRIPTION restarted a 23-minute macOS test
# job and cancelled the one already running, because the two shared a concurrency group.
#
# So the body check gets its own workflow, its own concurrency group, and its own required
# context. Editing a description re-runs this and nothing else.
#
# AND IT NOW CARRIES THE RETARGET REFUSAL
# ---------------------------------------
# `ci.yml` kept `edited` after the body check moved, for the one shape only `edited` delivers: a
# RETARGET, which changes what the pull request merges into. #960 measured what that cost. A
# metadata-only run of `ci.yml` published no check run under `build`, `compile` or `test`, but it
# still created a check SUITE, and the ruleset reads the newest suite for an app -- so a typo fix
# in a description made the three code contexts read as `expected` again and refused the merge
# until a close-and-reopen or a second 30-minute macOS run.
#
# `edited` therefore came out of `ci.yml`, and the retarget is caught HERE instead, by the first
# step below. This workflow is required, subscribes to `edited`, and takes about fifteen seconds;
# it cannot revalidate the code, and it does not try to. It REFUSES: any `edited` that is not a
# title or body change makes `pr-policy` red, and a red required context blocks the merge until a
# push or a reopen puts the code gates back over the pull request as it now is. The rule did not
# move -- it is still `Scripts/classify-pull-request-event.py` -- only the enforcement site did.
#
# THIS IS THE ONLY COPY NOW
# -------------------------
# It was additive while the duplicate in `ci.yml` held the merge block, because `pr-policy` was
# required by nothing and removing the original first would have deleted the block and left a green
# check that stopped nothing. That order has been followed:
#
#   2026-09-21  `pr-policy` added to the `required_status_checks` rule of ruleset 19060230
#               (`release-qualification-trust-boundary`, branch target, `~DEFAULT_BRANCH`,
#               enforcement active, bypass_actors empty), alongside build, compile and test, each
#               with integration_id 15368, strict_required_status_checks_policy left true.
#               Re-read from the API after the change; the delta was that one added context.
#   then        the duplicate job came out of `ci.yml`, and the body check exists only here.
#
# `.github/ci/CI-GATE.json` is what a guard reads: this file declares `gates_merges: true` and owns
# the two Canon commands below. Deleting either of them from this file fails the required-gate
# guard under Scripts/, which is what stops the migration from becoming a deletion.
#
# A PULL REQUEST OPENED BEFORE THE RULESET CHANGED
# ------------------------------------------------
# A required context is satisfied by a check run on the head commit, and this workflow only
# produces one when it is TRIGGERED. A pull request whose head predates 2026-09-21 therefore has
# no `pr-policy` run at all: branch protection reports the context missing and the merge waits --
# correctly, because nothing has read that body under the rule now in force.
#
# The recovery is one event, and the two are not equally cheap. PREFER EDITING THE DESCRIPTION:
# `edited` with only `title`/`body` in `changes` is metadata to `Scripts/classify-pull-request-
# event.py`, so it re-runs THIS workflow and leaves a code verdict already on the commit alone.
# Closing and reopening also works and costs more -- `reopened` is a CODE event to that classifier,
# alongside `opened` and `synchronize`, so it re-runs the full validation including the macOS job.
# A rebase or an empty commit is the most expensive way round: it moves the head, so nothing on the
# old commit carries over. There were no open pull requests when the ruleset changed, so this is
# written for the next migration rather than for a queue that was stranded by this one.

on:
  pull_request:
    branches: [main]
    # `edited` fires on a body or title change AND on a base change. The second is not cosmetic --
    # retargeting a pull request changes what it merges into -- and since #960 this workflow is the
    # only gate that hears about it, which is what the first step below exists to answer.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # NOT `ci.yml`'s group. Sharing it is what made editing a description cancel a running build.
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `check-canon-citations.py` compares its waiver lists against `git merge-base`, and
          # fails outright under CI when it cannot read one.
          fetch-depth: 0

      - name: An edit that is not a title or a body change has not been validated as code
        # FIRST, before anything reads the body: if this event changed what the pull request
        # MERGES INTO, what the body says is the smaller question. `ci.yml` no longer subscribes
        # to `edited` (#960), so a retarget reaches no code gate at all; this step is where it is
        # refused, and a red `pr-policy` is what holds the merge until a push or a reopen runs
        # them again.
        #
        # The payload is read from `GITHUB_EVENT_PATH` by the script. Nothing from the title or
        # the body is interpolated into this shell, and the script echoes no part of either.
        # Every non-zero status fails this step, including the usage exit: a step that could not
        # decide must not report that it decided.
        run: python3 Scripts/classify-pull-request-event.py --refuse-unvalidated-edit

      - name: Read the body and the complete list of changed files
        # REST with `--paginate`, not `gh pr view --json files`. That form returns the first page
        # and says nothing about the rest, so a pull request over the page size would have had its
        # file list SILENTLY TRUNCATED -- and the truncation makes the citation opt-out look
        # applicable to a change that touches Logic-facing paths further down the list.
        #
        # Both values go to FILES. Interpolating a pull request body into a shell string is how a
        # description becomes a command.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q .body > pr-body.md
          # `.filename`, not `.path`. The REST endpoint spells it `filename`; `gh pr view --json
          # files` -- the GraphQL form this replaces -- spells it `path`, and reading one field
          # name off the other API is how the first run of this workflow produced an EMPTY list.
          # It failed closed on `test -s` below, which is the only reason that was a red check
          # rather than a change that had opted out of citing Logic without saying so.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename' > pr-changed.txt
          # A pull request that changes nothing does not exist, so an empty list is a failed query
          # rather than an answer -- and an empty list used to reopen the opt-out. This caught the
          # wrong field name above on this workflow's very first run.
          test -s pr-changed.txt
          # The API reports the total; if the paginated read is short of it, this did not see the
          # whole change and must not judge it. (REST caps this endpoint at 3000 files, which is
          # itself a refusal rather than a truncation.)
          EXPECTED=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q .changed_files)
          ACTUAL=$(grep -c . pr-changed.txt)
          echo "changed files: read $ACTUAL of $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::read $ACTUAL of $EXPECTED changed files. An incomplete list cannot decide"
            echo "::error::whether this change may opt out of citing Logic."
            exit 1
          fi

      - name: Citations in the tree bind to files this change touches
        run: python3 Scripts/check-canon-citations.py --changed pr-changed.txt

      - name: The pull request body cites Logic, or says it states no fact about Logic
        # Whether this change may opt out is derived from what it TOUCHES, not from what its
        # description says about itself. Without the file list the opt-out is one sentence anybody
        # can type, and review walked through it three ways.
        #
        # Split across two lines on purpose: `.github/ci/CI-GATE.json` pins this invocation by the
        # continuation, which is the spelling it had in `ci.yml` before the body check moved here.
        # That list may only grow, so the pin follows the command rather than being deleted with
        # the old job -- a migration that removes the requirement is a deletion wearing its name.
        run: |
          python3 Scripts/check-canon-citations.py \
            --text pr-body.md --changed pr-changed.txt

      - name: What to do about a Canon failure
        # Diagnostics for the contributor, not a verdict: `if: failure()` and it prints only
        # static text. Nothing from the body or the title is echoed -- those are attacker-
        # controlled strings, and a workflow annotation is a rendering surface.
        if: failure()
        run: |
          echo "::notice::The pull request BODY is what this job reads. See CONTRIBUTING.md,"
          echo "::notice::section 'Citing Logic's own data', and docs/canon/README.md."
          echo "::notice::If this change states no fact about Logic, write the opt-out sentence"
          echo "::notice::docs/canon/README.md gives, in visible prose, with the reason. It is"
          echo "::notice::refused for a change that edits a Logic-facing path (docs/canon/"
          echo "::notice::LOGIC-FACING.json lists those prefixes), whatever the body says."
          echo "::notice::Editing the description re-runs THIS workflow only; no compile or test"
          echo "::notice::job is restarted, and no code verdict already on this commit changes."
          echo "::notice::It does not block the merge either -- it did until #960, because the"
          echo "::notice::code workflow also ran on the edit and its newer check suite reported"
          echo "::notice::none of the three code contexts. That workflow no longer runs on an edit."
