name: Publish MCP Registry Metadata

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged main commit containing the Formula and server.json update.
        required: true
        type: string
      expected_version:
        description: Exact published release version (vMAJOR.MINOR.PATCH[-prerelease]).
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.7.9

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha }}

      - name: Bind dispatch to exact merged registry commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected SHA must be a lowercase 40-character commit SHA"
            exit 1
          fi
          if ! [[ "$EXPECTED_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
            echo "::error::expected version is not strict SemVer"
            exit 1
          fi
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Committed metadata matches the expected published version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_VERSION" <<'PY'
          import json, re, sys
          expected = sys.argv[1].removeprefix("v")
          formula = open("Formula/logic-pro-mcp.rb", encoding="utf-8").read()
          matches = re.findall(r'^\s*version\s+"([^"]+)"', formula, re.M)
          if matches != [expected]:
              raise SystemExit(f"Formula version {matches!r} does not uniquely equal {expected}")
          server = json.load(open("server.json", encoding="utf-8"))
          if server.get("version") != expected:
              raise SystemExit("server.json version does not equal expected_version")
          publisher = server["_meta"]["io.modelcontextprotocol.registry/publisher-provided"]
          if publisher["distribution"]["release"].rsplit("/", 1)[-1] != "v" + expected:
              raise SystemExit("server.json release URL does not equal expected_version")
          PY
          python3 Scripts/check-registry-metadata-matches-the-release.py
          bash Scripts/ci-verify-formula-sha.sh

      - name: Download MCP Publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          case "$asset" in
            mcp-publisher_linux_amd64.tar.gz)
              sha256="ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"
              ;;
            mcp-publisher_linux_arm64.tar.gz)
              sha256="04f5199b3deef8e6fc4d6ed98c56a74f799def53edca3fe6d4862ecd4397c172"
              ;;
            *)
              echo "::error::unsupported mcp-publisher asset for $os/$arch"
              exit 1
              ;;
          esac
          curl -fsSLo "$asset" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}"
          echo "${sha256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate metadata
        run: ./mcp-publisher validate

      - name: Login with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish metadata
        run: ./mcp-publisher publish
