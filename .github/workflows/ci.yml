name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # These suites carry most of the measured runtime. SwiftPM applies the expression to an
  # implementation-qualified name while `swift test list` includes the module prefix.
  TEST_SHARD_SELECTOR: '\.(QualificationRunnerTests|Issue965FreshPopulationAcquisitionTests|Issue538TrackCreationObservationTests|Issue968ExactTrackNameAdapterTests|QualificationFaultInjectionTests|MIDIReadbackCallSiteLintTests|Issue538ModalWitnessTests)/'

jobs:
  change-scope:
    name: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full-validation: ${{ steps.scope.outputs.full-validation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode=docs-only
          changed=0
          while IFS= read -r -d '' path; do
            changed=$((changed + 1))
            case "$path" in
              docs/*|*.md) ;;
              *) mode=full ;;
            esac
          done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA")
          if [ "$changed" -eq 0 ]; then mode=full; fi
          if [ "$mode" = full ]; then full_validation=true; else full_validation=false; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "full-validation=$full_validation" >> "$GITHUB_OUTPUT"

  release-build:
    name: release-build
    needs: change-scope
    if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-clt-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-clt-

      - name: Use Command Line Tools
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift
          uname -m
          sw_vers

      - name: Build release configuration
        run: |
          set -euo pipefail
          swift build -c release
          git diff --exit-code Package.resolved
          test -x .build/release/LogicProMCP
          mkdir -p "$RUNNER_TEMP/release-runtime"
          cp .build/release/LogicProMCP "$RUNNER_TEMP/release-runtime/LogicProMCP"
          git rev-parse HEAD > "$RUNNER_TEMP/release-runtime/candidate-sha.txt"

      - name: Publish release executable for fault-exclusion tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/release-runtime
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-build:
    name: test-build
    needs: change-scope
    if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 130
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Product source guards
        run: |
          set -euo pipefail
          bash Scripts/ci-forbid-dead-expect.sh
          bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh

      - name: Run Python product tests in parallel
        run: |
          set -euo pipefail
          tests=(
            Scripts/test_logic_ui_jxa.py
            Scripts/test_logic_variants.py
            Scripts/test_logic_session_bootstrap.py
            Scripts/test_logic_session_bootstrap_action.py
            Scripts/test_bounce_modules.py
            Scripts/test_logic_key_event.py
            Scripts/test_logic_controller_learn_mode.py
            Scripts/test_logic_free_tempo_modal.py
            Scripts/test_pure_logic_modules.py
            Scripts/test_live_e2e_bridge.py
            Scripts/test_ci_coverage_gate.py
            Scripts/test_ci_test_shard_manifest.py
            Scripts/run-helper-suites.py
          )
          pids=()
          for test_file in "${tests[@]}"; do
            python3 "$test_file" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          test "$failed" -eq 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-clt-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-clt-

      - name: Use Command Line Tools
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift
          uname -m
          sw_vers

      - name: Build one coverage runtime and exact shard manifests
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/test-runtime"
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-build-profraw"
          mkdir -p "$artifact" "$PROFRAW_DIR"
          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"
          swift build --build-tests --enable-code-coverage -Xswiftc -suppress-warnings
          git diff --exit-code Package.resolved
          swift test list --skip-build > "$artifact/inventory-raw.txt"
          LC_ALL=C sort "$artifact/inventory-raw.txt" > "$artifact/inventory.txt"
          rm "$artifact/inventory-raw.txt"
          python3 Scripts/ci-test-shard-manifest.py partition \
            --inventory "$artifact/inventory.txt" \
            --selector "$TEST_SHARD_SELECTOR" \
            --selected "$artifact/selected.txt" \
            --complement "$artifact/complement.txt"

          triple_debug=$(readlink .build/debug)
          test_bundle=".build/$triple_debug/LogicProMCPPackageTests.xctest"
          test_binary="$test_bundle/Contents/MacOS/LogicProMCPPackageTests"
          test -x "$test_binary"
          test -x ".build/$triple_debug/LogicProMCP"
          tar -czf "$artifact/runtime.tar.gz" \
            .build/debug "$test_bundle" ".build/$triple_debug/LogicProMCP"
          git rev-parse HEAD > "$artifact/candidate-sha.txt"

      - name: Publish test runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/test-runtime
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-shards:
    name: test-shards (${{ matrix.shard }})
    needs: [change-scope, release-build, test-build]
    if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: selected
            mode: filter
          - shard: complement
            mode: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Use Command Line Tools
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-clt-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-clt-

      - name: Download test runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/test-runtime

      - name: Download release executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/release-runtime

      - name: Run this exact serial shard
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          SHARD_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/test-runtime"
          out="$RUNNER_TEMP/test-shard-$SHARD"
          xunit_dir="$out/xunit"
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw-$SHARD"
          COVERAGE_LOG="$out/test.log"
          mkdir -p "$out" "$xunit_dir" "$PROFRAW_DIR"
          test "$(cat "$runtime/candidate-sha.txt")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/release-runtime/candidate-sha.txt")" = "$GITHUB_SHA"
          tar -xzf "$runtime/runtime.tar.gz" -C "$GITHUB_WORKSPACE"
          mkdir -p .build/release
          cp "$RUNNER_TEMP/release-runtime/LogicProMCP" .build/release/LogicProMCP
          chmod +x .build/release/LogicProMCP
          triple_debug=$(readlink .build/debug)
          test -x ".build/$triple_debug/LogicProMCPPackageTests.xctest/Contents/MacOS/LogicProMCPPackageTests"
          test -x ".build/$triple_debug/LogicProMCP"
          test -x .build/release/LogicProMCP
          swift test list --skip-build > "$RUNNER_TEMP/inventory-$SHARD-raw.txt"
          LC_ALL=C sort "$RUNNER_TEMP/inventory-$SHARD-raw.txt" > "$RUNNER_TEMP/inventory-$SHARD.txt"
          cmp "$runtime/inventory.txt" "$RUNNER_TEMP/inventory-$SHARD.txt"

          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"
          if [ "$SHARD_MODE" = filter ]; then
            swift test --skip-build --enable-code-coverage --no-parallel \
              --xunit-output "$xunit_dir/results.xml" --filter "$TEST_SHARD_SELECTOR" \
              2>&1 | tee "$COVERAGE_LOG"
          else
            swift test --skip-build --enable-code-coverage --no-parallel \
              --xunit-output "$xunit_dir/results.xml" --skip "$TEST_SHARD_SELECTOR" \
              2>&1 | tee "$COVERAGE_LOG"
          fi
          python3 Scripts/ci-test-shard-manifest.py verify-xunit \
            --expected "$runtime/$SHARD.txt" \
            --xunit-directory "$xunit_dir" \
            --actual "$out/actual-$SHARD.txt"
          find .build -type f -path '*/debug/codecov/default.profdata' \
            > "$RUNNER_TEMP/profiles-$SHARD.txt"
          test "$(grep -c . "$RUNNER_TEMP/profiles-$SHARD.txt")" = 1
          cp "$(cat "$RUNNER_TEMP/profiles-$SHARD.txt")" "$out/$SHARD.profdata"

      - name: Keep this shard's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/test-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  product-validation:
    name: product-validation
    needs: [change-scope, release-build, test-build, test-shards]
    if: always()
    runs-on: ${{ needs.change-scope.outputs.full-validation == 'true' && 'macos-15-intel' || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.product.outcome }}
      docs-only: ${{ steps.docs-only.outcome }}
    steps:
      - name: Validate documentation-only change
        id: docs-only
        if: ${{ needs.change-scope.outputs.full-validation != 'true' }}
        env:
          SCOPE: ${{ needs.change-scope.result }}
          MODE: ${{ needs.change-scope.outputs.mode }}
          RELEASE: ${{ needs.release-build.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
          SHARDS: ${{ needs.test-shards.result }}
        run: |
          set -euo pipefail
          test "$SCOPE" = success
          test "$MODE" = docs-only
          test "$RELEASE" = skipped
          test "$TEST_BUILD" = skipped
          test "$SHARDS" = skipped

      - name: Require complete product producers
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        env:
          SCOPE: ${{ needs.change-scope.result }}
          RELEASE: ${{ needs.release-build.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
          SHARDS: ${{ needs.test-shards.result }}
        run: |
          set -euo pipefail
          test "$SCOPE" = success
          test "$RELEASE" = success
          test "$TEST_BUILD" = success
          test "$SHARDS" = success

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        with:
          fetch-depth: 0

      - name: Use Command Line Tools
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift

      - name: Download test runtime
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/test-runtime

      - name: Download both shard results
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/test-shards

      - name: Verify exact union and merge coverage
        id: product
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/test-runtime"
          shards="$RUNNER_TEMP/test-shards"
          test "$(cat "$runtime/candidate-sha.txt")" = "$GITHUB_SHA"
          tar -xzf "$runtime/runtime.tar.gz" -C "$GITHUB_WORKSPACE"
          find "$shards" -type f -name actual-selected.txt > "$RUNNER_TEMP/selected-paths.txt"
          find "$shards" -type f -name actual-complement.txt > "$RUNNER_TEMP/complement-paths.txt"
          test "$(grep -c . "$RUNNER_TEMP/selected-paths.txt")" = 1
          test "$(grep -c . "$RUNNER_TEMP/complement-paths.txt")" = 1
          selected_dir=$(dirname "$(cat "$RUNNER_TEMP/selected-paths.txt")")
          complement_dir=$(dirname "$(cat "$RUNNER_TEMP/complement-paths.txt")")
          python3 Scripts/ci-test-shard-manifest.py verify-union \
            --inventory "$runtime/inventory.txt" \
            --selected "$selected_dir/actual-selected.txt" \
            --complement "$complement_dir/actual-complement.txt"

          triple_debug=$(readlink .build/debug)
          find .build -type d -name codecov -prune -exec rm -rf {} + 2>/dev/null || true
          mkdir -p ".build/$triple_debug/codecov"
          xcrun llvm-profdata merge -sparse \
            "$selected_dir/selected.profdata" \
            "$complement_dir/complement.profdata" \
            -o ".build/$triple_debug/codecov/default.profdata"
          bash Scripts/ci-coverage-gate.sh

      - name: Keep combined coverage report
        if: ${{ always() && needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage-report.txt
            ${{ runner.temp }}/test-shards
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [change-scope, product-validation]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Product validation must pass
        env:
          SCOPE: ${{ needs.change-scope.result }}
          MODE: ${{ needs.change-scope.outputs.mode }}
          VALIDATION: ${{ needs.product-validation.result }}
          PRODUCT: ${{ needs.product-validation.outputs.outcome }}
          DOCS_ONLY: ${{ needs.product-validation.outputs.docs-only }}
        run: |
          set -euo pipefail
          test "$SCOPE" = success
          test "$VALIDATION" = success
          if [ "$MODE" = full ]; then
            test "$PRODUCT" = success
          else
            test "$MODE" = docs-only
            test "$DOCS_ONLY" = success
          fi
