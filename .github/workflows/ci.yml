name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  change-scope:
    name: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full-validation: ${{ steps.scope.outputs.full-validation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode=docs-only
          changed=0
          while IFS= read -r -d '' path; do
            changed=$((changed + 1))
            case "$path" in
              docs/*|*.md) ;;
              *) mode=full ;;
            esac
          done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA")
          if [ "$changed" -eq 0 ]; then mode=full; fi
          if [ "$mode" = full ]; then full_validation=true; else full_validation=false; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "full-validation=$full_validation" >> "$GITHUB_OUTPUT"

  product-validation:
    name: product-validation
    needs: change-scope
    runs-on: ${{ needs.change-scope.outputs.full-validation == 'true' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 150
    outputs:
      outcome: ${{ steps.product.outcome }}
      docs-only: ${{ steps.docs-only.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Product source guards
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          set -euo pipefail
          bash Scripts/ci-forbid-dead-expect.sh
          bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh

      - name: Set up Python 3.11
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Scripts/requirements-ci.txt

      - name: Install test dependencies
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/logic-pro-ci-venv"
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          python3 -m pip install --disable-pip-version-check -r Scripts/requirements-ci.txt

      - name: Cache SwiftPM downloads
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-clt-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-clt-

      - name: Use Command Line Tools
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift
          uname -m
          sw_vers

      - name: Run Python product tests in parallel
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          set -euo pipefail
          tests=(
            Scripts/test_logic_ui_jxa.py
            Scripts/test_logic_variants.py
            Scripts/test_logic_session_bootstrap.py
            Scripts/test_logic_session_bootstrap_action.py
            Scripts/test_logic_bounce.py
            Scripts/test_bounce_modules.py
            Scripts/test_logic_key_event.py
            Scripts/test_logic_controller_learn_mode.py
            Scripts/test_logic_free_tempo_modal.py
            Scripts/test_pure_logic_modules.py
            Scripts/test_live_e2e_bridge.py
            Scripts/test_ci_coverage_gate.py
            Scripts/run-helper-suites.py
          )
          pids=()
          for test_file in "${tests[@]}"; do
            python3 "$test_file" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          test "$failed" -eq 0

      - name: Build and test the product
        id: product
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          swift build -c release
          git diff --exit-code Package.resolved

          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw"
          COVERAGE_LOG="$RUNNER_TEMP/logicpromcp-coverage.log"
          mkdir -p "$PROFRAW_DIR"
          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"
          if ! swift test --enable-code-coverage -Xswiftc -suppress-warnings --no-parallel \
              >"$COVERAGE_LOG" 2>&1; then
            tail -n 400 "$COVERAGE_LOG"
            exit 1
          fi
          tail -n 80 "$COVERAGE_LOG"
          bash Scripts/ci-coverage-gate.sh

      - name: Validate documentation-only change
        id: docs-only
        if: ${{ needs.change-scope.outputs.full-validation != 'true' }}
        env:
          CHANGE_MODE: ${{ needs.change-scope.outputs.mode }}
        run: test "$CHANGE_MODE" = "docs-only"

      - name: Keep test and coverage reports
        if: ${{ always() && needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-report.txt
            ${{ runner.temp }}/logicpromcp-coverage.log
          retention-days: 7
          if-no-files-found: warn

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [change-scope, product-validation]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Product validation must pass
        env:
          SCOPE: ${{ needs.change-scope.result }}
          MODE: ${{ needs.change-scope.outputs.mode }}
          VALIDATION: ${{ needs.product-validation.result }}
          PRODUCT: ${{ needs.product-validation.outputs.outcome }}
          DOCS_ONLY: ${{ needs.product-validation.outputs.docs-only }}
        run: |
          set -euo pipefail
          test "$SCOPE" = "success"
          test "$VALIDATION" = "success"
          if [ "$MODE" = "full" ]; then
            test "$PRODUCT" = "success"
          else
            test "$MODE" = "docs-only"
            test "$DOCS_ONLY" = "success"
          fi
