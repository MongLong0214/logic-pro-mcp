name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the build job only reads the repo. Declaring the scope here
# (release.yml / publish-mcp.yml already pin theirs) drops the default token
# from read/write to read-only for every job in this workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `docs/roadmap/README.md` declares itself the source of truth for what is open, and its update
  # rule ("the same PR that opens or closes an issue updates the table") is a convention until
  # something fails when it is not kept. This is that something.
  #
  # Its own job rather than a step in `compile`: the check reads issue state, so it needs a token
  # scope the build jobs do not have. Adding `issues: read` to the workflow-level `permissions`
  # would hand it to every job instead of the one that needs it. It is also not in
  # `run-repo-guards.py`, whose contract is plain Python needing neither Xcode nor a network.
  roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Self-test the roadmap drift guard (#678)
        # Offline, fixtures only. Asserts the guard fails on a stale row, on an open issue nobody
        # added, and on a row pointing at no issue — and that it refuses (exit 2) rather than
        # reporting clean on a truncated issue list or a table it could not parse.
        run: bash Scripts/test-roadmap-table-guard.sh

      - name: Roadmap table matches GitHub (#678)
        # `--pr` is passed only on a pull request, and only so the table may mark closed the issues
        # THAT pull request says it closes. Without it a PR closing an issue has no truthful row to
        # write: open while it is open, stale the instant it merges — which is what turned main red
        # on #684's own merge commit. On a push to main no number is passed and nothing is exempt.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/roadmap-table-matches-github.py \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '' }}

  compile:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Forbid dead boolean #expect (#393 test-integrity)
        # `#expect(<Bool> == true/false)` and kin pass unconditionally on this toolchain — they
        # prove nothing. Fail fast (no Xcode needed) before the build if any reappear.
        run: bash Scripts/ci-forbid-dead-expect.sh

      - name: Self-test the preflight stamp gate (#552)
        # The stamp only helps if it actually refuses. This asserts NOT-STAMPED is 1, stamped is 0, an
        # unresolvable tree-ish is 2, and the hook refuses an unstamped commit while allowing a deletion.
        run: bash Scripts/test-preflight-stamp.sh

      - name: Self-test the menu-literal guard (#519)
        # A guard nobody has watched fail is decoration. This asserts each known evasion is caught, that
        # legitimate code is not flagged, and that a tree the guard cannot examine is never reported
        # clean — the failure the guard itself had before review.
        run: bash Scripts/test-menu-literal-guard.sh

      - name: Forbid hard-coded menu-bar item literals (#519 locale-routing)
        # A literal `menu bar item "..."` cannot reach the extra locale variants
        # AXLocalePolicy already records for that menu. Fail fast before the build if one
        # reappears — see the script for the full rationale.
        run: bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh

      - name: Guards and headless drives (discovered, not listed)
        # Each of these used to be its own step, duplicated across compile and test, and the file
        # conflicted on three consecutive PRs — every one appending at the same point. The runner
        # discovers Scripts/check-*.py and the test_*.py drives, so adding a guard no longer edits
        # this workflow. It prints each one and its result, and runs them all before reporting.
        run: python3 Scripts/run-repo-guards.py

      - name: Cache SwiftPM and build products
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos15-xcode164-release-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-macos15-xcode164-release-

      - name: Select Xcode
        # Xcode 16.4 ships Swift 6.2 — required by swift-sdk 0.11.0+ which
        # adopts the short-form `withThrowingTaskGroup { ... }` syntax. The
        # previous 16.2 pin (Swift 6.0) cannot compile that form.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build
        run: swift build -c release

      - name: Verify Package.resolved is unchanged
        run: git diff --exit-code Package.resolved


  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Forbid dead boolean #expect (#393 test-integrity)
        # `#expect(<Bool> == true/false)` and kin pass unconditionally on this toolchain — they
        # prove nothing. Fail fast (no Xcode needed) before the build if any reappear.
        run: bash Scripts/ci-forbid-dead-expect.sh

      - name: Self-test the preflight stamp gate (#552)
        # The stamp only helps if it actually refuses. This asserts NOT-STAMPED is 1, stamped is 0, an
        # unresolvable tree-ish is 2, and the hook refuses an unstamped commit while allowing a deletion.
        run: bash Scripts/test-preflight-stamp.sh

      - name: Self-test the menu-literal guard (#519)
        # A guard nobody has watched fail is decoration. This asserts each known evasion is caught, that
        # legitimate code is not flagged, and that a tree the guard cannot examine is never reported
        # clean — the failure the guard itself had before review.
        run: bash Scripts/test-menu-literal-guard.sh

      - name: Forbid hard-coded menu-bar item literals (#519 locale-routing)
        # A literal `menu bar item "..."` cannot reach the extra locale variants
        # AXLocalePolicy already records for that menu. Fail fast before the build if one
        # reappears — see the script for the full rationale.
        run: bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh

      - name: Guards and headless drives (discovered, not listed)
        # Each of these used to be its own step, duplicated across compile and test, and the file
        # conflicted on three consecutive PRs — every one appending at the same point. The runner
        # discovers Scripts/check-*.py and the test_*.py drives, so adding a guard no longer edits
        # this workflow. It prints each one and its result, and runs them all before reporting.
        run: python3 Scripts/run-repo-guards.py

      - name: Cache SwiftPM and build products
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos15-xcode164-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-macos15-xcode164-debug-

      - name: Select Xcode
        # Xcode 16.4 ships Swift 6.2 — required by swift-sdk 0.11.0+ which
        # adopts the short-form `withThrowingTaskGroup { ... }` syntax. The
        # previous 16.2 pin (Swift 6.0) cannot compile that form.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Coverage report
        # H-4 (2026-05-08 enterprise review) closed in v3.4.0: re-armed
        # the coverage gate. Pre-fix this step disabled shell error handling
        # and exited successfully, so coverage regressions never blocked
        # a merge — exactly the bug the previous review caught.
        #
        # The step now runs in TWO phases:
        #   1. Generate the report fail-closed: the coverage test command,
        #      profdata lookup, llvm-cov report, and threshold parser must all
        #      succeed. LLVM runtime profile warnings are surfaced, but are not
        #      treated as the gate by themselves because GitHub's macOS runner
        #      can emit recoverable child-process profile warnings while still
        #      producing a valid default.profdata.
        #   2. Enforce thresholds (this is the actual gate).
        #
        # Hard thresholds: 70% region, 78% line. 90% line coverage is the
        # project target, but not the hard gate until a dedicated coverage
        # uplift lands; setting 90% today would only make every release red.
        if: always()
        run: |
          set -euo pipefail
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw"
          COVERAGE_LOG="$RUNNER_TEMP/logicpromcp-coverage.log"
          mkdir -p "$PROFRAW_DIR"
          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"

          swift test --enable-code-coverage -Xswiftc -suppress-warnings --no-parallel 2>&1 | tee "$COVERAGE_LOG"
          PROFILE_WARNING_COUNT=$(grep -c "LLVM Profile Error" "$COVERAGE_LOG" || true)
          if [ "$PROFILE_WARNING_COUNT" != "0" ]; then
            echo "::warning::LLVM profile runtime reported $PROFILE_WARNING_COUNT warning(s); continuing to profdata/report validation."
            echo "::warning::LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE"
          fi

          # v3.4.3: locate the test binary + profdata via `find` instead of
          # the `.build/debug/...` symlink path. The symlink exists on local
          # arm64 Macs but its presence under the macos-15-arm64 GitHub
          # runner is not guaranteed across SwiftPM versions; an absent
          # symlink silently produces an empty coverage report. `find`
          # against the actual `.build/arm64-apple-macosx/debug/` tree is
          # path-version-stable.
          BIN=$(find .build -type f -path '*/debug/LogicProMCPPackageTests.xctest/Contents/MacOS/LogicProMCPPackageTests' | head -1)
          PROFDATA=$(find .build -type f -path '*/debug/codecov/default.profdata' | head -1)
          echo "Test binary: $BIN"
          echo "Profdata:    $PROFDATA"
          if [ -z "$BIN" ] || [ -z "$PROFDATA" ]; then
            echo "::error::Could not locate test binary or profdata; coverage gate cannot run."
            echo "::error::.build tree:"
            find .build -maxdepth 4 -type d | head -30
            exit 1
          fi

          find Sources/LogicProMCP -name '*.swift' | sort > /tmp/logicpro_sources.txt
          xargs xcrun llvm-cov report "$BIN" -instr-profile "$PROFDATA" \
            < /tmp/logicpro_sources.txt > coverage-report.txt
          echo "::group::Full coverage report"
          cat coverage-report.txt
          echo "::endgroup::"

          # Extract TOTAL line — llvm-cov column order: regions, missed,
          # cover%, functions, missed, cover%, lines, missed, cover%.
          # v3.4.1 (independent review P2-4): validate extracted values match the
          # `<float>%` shape before threshold compare. A future LLVM
          # version that prepends a column (e.g. instantiation summary
          # in TOTAL) would silently grab a different field; the regex
          # guard below makes that fail-loud instead.
          TOTAL_LINE=$(grep -E "^TOTAL" coverage-report.txt || true)
          REGION_RAW=$(echo "$TOTAL_LINE" | awk '{print $4}')
          LINE_RAW=$(echo "$TOTAL_LINE" | awk '{print $10}')
          if ! echo "$REGION_RAW" | grep -qE '^[0-9]+\.[0-9]+%$'; then
            echo "::error::Region coverage field '$REGION_RAW' did not match <float>% pattern."
            echo "::error::TOTAL line was: $TOTAL_LINE"
            echo "::error::This usually means llvm-cov column order changed; review the awk extraction."
            exit 1
          fi
          if ! echo "$LINE_RAW" | grep -qE '^[0-9]+\.[0-9]+%$'; then
            echo "::error::Line coverage field '$LINE_RAW' did not match <float>% pattern."
            echo "::error::TOTAL line was: $TOTAL_LINE"
            exit 1
          fi
          REGION_PCT=$(echo "$REGION_RAW" | tr -d '%')
          LINE_PCT=$(echo "$LINE_RAW" | tr -d '%')

          {
            echo "## Coverage report"
            echo ""
            echo '```'
            echo "$TOTAL_LINE"
            echo '```'
            echo ""
            echo "Hard thresholds: region ≥ 70%, line ≥ 78%."
            echo "Coverage target: line ≥ 90%."
            echo "LLVM profile warnings: ${PROFILE_WARNING_COUNT:-0}."
          } >> "$GITHUB_STEP_SUMMARY"

          MIN_REGION=70
          MIN_LINE=78
          COVERAGE_TARGET=90
          FAIL=0
          if [ -z "$REGION_PCT" ] || [ -z "$LINE_PCT" ]; then
            echo "::error::Could not parse coverage TOTAL line; coverage gate cannot evaluate."
            FAIL=1
          else
            # Bash arithmetic doesn't handle floats; use awk for the comparison.
            REGION_OK=$(awk -v r="$REGION_PCT" -v m="$MIN_REGION" 'BEGIN { print (r+0 >= m+0) ? 1 : 0 }')
            LINE_OK=$(awk -v l="$LINE_PCT" -v m="$MIN_LINE" 'BEGIN { print (l+0 >= m+0) ? 1 : 0 }')
            if [ "$REGION_OK" != "1" ]; then
              echo "::error::Region coverage $REGION_PCT% below threshold $MIN_REGION%."
              FAIL=1
            fi
            if [ "$LINE_OK" != "1" ]; then
              echo "::error::Line coverage $LINE_PCT% below threshold $MIN_LINE%."
              FAIL=1
            fi
            TARGET_OK=$(awk -v l="$LINE_PCT" -v m="$COVERAGE_TARGET" 'BEGIN { print (l+0 >= m+0) ? 1 : 0 }')
            if [ "$TARGET_OK" != "1" ]; then
              echo "::notice::Line coverage $LINE_PCT% is below the 90% target; hard gate remains $MIN_LINE% until coverage uplift lands."
            fi
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "Coverage gate passed: region $REGION_PCT% / line $LINE_PCT%."

  # The branch ruleset requires the context `build` and nothing else. This job IS that context: it
  # does no work and exists so that one required name transitively requires every real gate. It must
  # run with `if: always()` and inspect results explicitly — a job skipped because a dependency
  # failed reports as skipped, and GitHub does not treat a skipped required check as a failure.
  # The single required status check on `main`, and deliberately the only one.
  #
  # This job runs no build of its own — it is the aggregator. `if: always()` makes it run even when a
  # dependency failed, and it then refuses unless every gate succeeded. Requiring it is therefore
  # equivalent to requiring `compile` and `test`, with two advantages: renaming or adding a gate does not
  # need the branch ruleset edited in lockstep, and a job that legitimately does not run on some event
  # cannot leave a required check pending forever and wedge the merge button.
  #
  # If you are here because "only `build` is required" looked like a hole: it is not. Add new gates to
  # `needs` and assert their result below; do not add them to the ruleset.
  build:
    runs-on: ubuntu-latest
    needs: [compile, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every gate must have passed
        run: |
          echo "compile=${{ needs.compile.result }} test=${{ needs.test.result }}"
          [ "${{ needs.compile.result }}" = "success" ] || { echo "::error::compile did not succeed"; exit 1; }
          [ "${{ needs.test.result }}" = "success" ] || { echo "::error::test did not succeed"; exit 1; }
