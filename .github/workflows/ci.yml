name: CI

on:
  # The default-branch ruleset is strict, permits merge commits only, and has no bypass actor.
  # Therefore the admitted main tree is the exact tree already exercised by this PR merge-candidate
  # workflow; replaying both macOS validation jobs on main only competes with the next PR.
  pull_request:
    branches: [main]
    # `edited` stays excluded: PR metadata must not replace code CI's required check suite.
    types: [opened, synchronize, reopened]

# Least privilege: the build job only reads the repo. Declaring the scope here
# (release.yml / publish-mcp.yml already pin theirs) drops the default token
# from read/write to read-only for every job in this workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The DEFAULT shell for a `run:` block is `bash -e {0}` -- no `pipefail`. So `a | tee log` reports
# tee's exit code and a failing `a` reads as success, which is the shape of defect that lets a red
# test suite finish green. Naming `bash` selects GitHub's `bash --noprofile --norc -eo pipefail`,
# which is the same thing with the pipeline failure preserved. `-u` is deliberately not added: it
# is not what the default gives either, and turning it on globally is a different change.
defaults:
  run:
    shell: bash

jobs:
  # Route only one byte-exact, regular-file roadmap modification away from the product build.
  # The classifier validates the checked-out PR merge and fails closed before publishing outputs;
  # source, mixed, structural and uncertain changes all retain the complete macOS path.
  change-scope:
    name: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full-validation: ${{ steps.scope.outputs.full-validation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Classify the exact pull-request merge
        id: scope
        run: python3 Scripts/classify-ci-change.py

  # WAS `roadmap`, and carried four things: two that compare GitHub issue state against
  # `docs/roadmap/README.md` and the ADR index, and two about the Homebrew Formula. Only the
  # second pair protects the product -- a wrong `sha256` is `brew install` failing for everyone --
  # and only the second pair belongs in front of a merge.
  #
  # The status checks moved to `.github/workflows/maintenance.yml`, manual and weekly. They still
  # FAIL there; they no longer stop an unrelated code change. Keeping them here meant a stale
  # roadmap row blocked a merge that had nothing to do with the roadmap, which is the cost the
  # instruction to separate them names.
  formula:
    name: formula
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Formula sha256 matches the release its version names (#775)
        # It runs on every build rather than only when `Formula/` changed. Not because the base is
        # unreachable — the checkout above is now full — but because the answer can go stale
        # without the file moving at all: it is a claim about a RELEASE, not about this tree, so
        # gating it on a diff would skip exactly the builds where it has newly become wrong.
        #
        # It cannot live in `run-repo-guards.py`: only the published release can answer whether
        # the hash is right, and the runner has no network/GitHub-authentication contract. Its
        # OFFLINE half does live there --
        # `Scripts/test_ci_verify_formula_sha.py` drives every classification through a fake `gh`.
        #
        # This is a merge gate and not a maintenance check, which is the line the roadmap and ADR
        # steps were moved across: a wrong `sha256` here is `brew install` failing for every user,
        # and that is a defect in what this repository ships rather than a bookkeeping drift.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/ci-verify-formula-sha.sh

  # Platform-independent shell integrity checks. The discovered Python runner stays in a macOS
  # job because #896 adds `test_logic_key_event.py`, whose Swift subprocess imports AppKit.
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Forbid dead boolean #expect (#393 test-integrity)
        # `#expect(<Bool> == true/false)` and kin pass unconditionally on this toolchain — they
        # prove nothing. Fail fast (no Xcode needed) before the build if any reappear.
        run: bash Scripts/ci-forbid-dead-expect.sh

      - name: Self-test the menu-literal guard (#519)
        # A guard nobody has watched fail is decoration. This asserts each known evasion is caught, that
        # legitimate code is not flagged, and that a tree the guard cannot examine is never reported
        # clean — the failure the guard itself had before review.
        run: bash Scripts/test-menu-literal-guard.sh

      - name: Self-test the typechecker-heavy-literal guard (#749)
        # Fixtures prove a three-concatenation value is refused and that unrelated one-concatenation
        # values, comments, and plain literals remain accepted.
        run: bash Scripts/test-typechecker-heavy-literal-guard.sh

      - name: Forbid hard-coded menu-bar item literals (#519 locale-routing)
        # A literal `menu bar item "..."` cannot reach the extra locale variants
        # AXLocalePolicy already records for that menu. Fail fast before the build if one
        # reappears — see the script for the full rationale.
        run: bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh

  offline-guards:
    name: offline-guards
    # This job builds no product artifact. Keep the scarce arm64 allocation available for the
    # complete product validation below; AppKit-dependent helpers still run on macOS.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Scripts/requirements-ci.txt

      - name: Install guard dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/logic-pro-ci-venv"
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          python3 -m pip install --disable-pip-version-check -r Scripts/requirements-ci.txt
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Offline guards and standalone drives
        run: |
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          set -o pipefail
          python3 -u Scripts/run-repo-guards.py 2>&1 | tee guard-run.log

      - name: Non-executable bounce test libraries (#896)
        run: |
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          python3 Scripts/run-helper-suites.py

      - name: Keep guard log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-guards-${{ github.run_id }}-${{ github.run_attempt }}
          path: guard-run.log
          retention-days: 7
          if-no-files-found: warn

  platform-validation:
    name: platform-validation
    # The hosted pool abandoned every second macos-15 request after 15 queued minutes. Request one
    # arm64 runner immediately and keep the release build, full serial suite, and coverage gate on
    # that runner. The 150-minute bound combines the former 60m compile and 120m test budgets while
    # retaining one checkout, dependency setup, cache restore, and toolchain selection.
    needs: change-scope
    runs-on: ${{ needs.change-scope.outputs.full-validation == 'true' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 150
    outputs:
      release-compile: ${{ steps.release-compile.outcome }}
      test-suite: ${{ steps.test-suite.outcome }}
      coverage-gate: ${{ steps.coverage-gate.outcome }}
      docs-only: ${{ steps.docs-only.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Observation ratchets compare the branch against its merge base and fail closed if that
          # history is unavailable.
          fetch-depth: 0

      - name: Set up Python 3.11
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Scripts/requirements-ci.txt

      - name: Install Swift test subprocess dependencies
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/logic-pro-ci-venv"
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          python3 -m pip install --disable-pip-version-check -r Scripts/requirements-ci.txt
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Cache SwiftPM downloads
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          # Cache downloads only. Reusing `.build` would let stale binaries or profiles qualify.
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode164-validation-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode164-validation-

      - name: Select Xcode and say which toolchain this is
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Build
        id: release-compile
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        # Preserve independent full-suite evidence when only the release configuration fails.
        continue-on-error: true
        run: |
          set -euo pipefail
          swift build -c release
          git diff --exit-code Package.resolved

      - name: Run the tests and collect coverage
        id: test-suite
        # The release-build outcome is carried to the required `compile` context below. It must not
        # hide an independent test failure from the same already-allocated runner.
        # Positive outcomes prove checkout, dependencies, cache, and Xcode selection all ran. A
        # skipped release step means one of those prerequisites failed, so do not test with an
        # unqualified fallback environment.
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && !cancelled() && (steps.release-compile.outcome == 'success' || steps.release-compile.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw"
          COVERAGE_LOG="$RUNNER_TEMP/logicpromcp-coverage.log"
          mkdir -p "$PROFRAW_DIR"
          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"

          # Coverage must come from this run. SwiftPM downloads are cached, but `.build` is not;
          # clearing any generated coverage directory also protects reused workspaces.
          find .build -type d -name codecov -prune -exec rm -rf {} + 2>/dev/null || true

          swift test --enable-code-coverage -Xswiftc -suppress-warnings --no-parallel 2>&1 | tee "$COVERAGE_LOG"
          # Runtime profile warnings are surfaced, but the readable report and hard threshold below
          # decide whether the evidence is valid.
          PROFILE_WARNING_COUNT=$(grep -c "LLVM Profile Error" "$COVERAGE_LOG" || true)
          if [ "$PROFILE_WARNING_COUNT" != "0" ]; then
            echo "::warning::LLVM profile runtime reported $PROFILE_WARNING_COUNT warning(s); continuing to profdata/report validation."
            echo "::warning::LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE"
          fi
          echo "LLVM profile warnings: ${PROFILE_WARNING_COUNT:-0}." >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        id: coverage-gate
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && !cancelled() && steps.test-suite.outcome == 'success' }}
        continue-on-error: true
        run: bash Scripts/ci-coverage-gate.sh

      - name: Preserve required validation identity for the exact roadmap-only change
        id: docs-only
        if: ${{ needs.change-scope.outputs.full-validation != 'true' }}
        env:
          CHANGE_MODE: ${{ needs.change-scope.outputs.mode }}
          FULL_VALIDATION: ${{ needs.change-scope.outputs.full-validation }}
        run: |
          set -euo pipefail
          [ "$CHANGE_MODE" = "roadmap-docs-only" ]
          [ "$FULL_VALIDATION" = "false" ]
          echo "Exact roadmap-only change: product build and test are not applicable." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test and coverage reports whatever happened
        if: ${{ always() && needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-report.txt
            ${{ runner.temp }}/logicpromcp-coverage.log
          retention-days: 7
          if-no-files-found: warn

  # These Ubuntu jobs publish the existing required context names. They fail closed on both the
  # producer result (setup/infrastructure) and the relevant validation step outcome.
  compile:
    name: compile
    runs-on: ubuntu-latest
    needs: [change-scope, offline-guards, platform-validation]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Offline guards and the release build must have passed
        env:
          OFFLINE_GUARDS: ${{ needs.offline-guards.result }}
          PLATFORM_VALIDATION: ${{ needs.platform-validation.result }}
          CHANGE_MODE: ${{ needs.change-scope.outputs.mode }}
          RELEASE_COMPILE: ${{ needs.platform-validation.outputs.release-compile }}
          DOCS_ONLY: ${{ needs.platform-validation.outputs.docs-only }}
        run: |
          echo "offline-guards=$OFFLINE_GUARDS platform-validation=$PLATFORM_VALIDATION mode=$CHANGE_MODE release-compile=$RELEASE_COMPILE docs-only=$DOCS_ONLY"
          [ "$OFFLINE_GUARDS" = "success" ] || { echo "::error::offline-guards did not succeed"; exit 1; }
          [ "$PLATFORM_VALIDATION" = "success" ] || { echo "::error::platform-validation did not succeed"; exit 1; }
          if [ "$CHANGE_MODE" = "full" ]; then
            [ "$RELEASE_COMPILE" = "success" ] || { echo "::error::release compile did not succeed"; exit 1; }
          else
            [ "$CHANGE_MODE" = "roadmap-docs-only" ] || { echo "::error::unknown change mode"; exit 1; }
            [ "$DOCS_ONLY" = "success" ] || { echo "::error::roadmap-only validation did not succeed"; exit 1; }
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [change-scope, platform-validation]
    if: always()
    timeout-minutes: 5
    steps:
      - name: The full serial suite and coverage gate must have passed
        env:
          PLATFORM_VALIDATION: ${{ needs.platform-validation.result }}
          CHANGE_MODE: ${{ needs.change-scope.outputs.mode }}
          TEST_SUITE: ${{ needs.platform-validation.outputs.test-suite }}
          COVERAGE_GATE: ${{ needs.platform-validation.outputs.coverage-gate }}
          DOCS_ONLY: ${{ needs.platform-validation.outputs.docs-only }}
        run: |
          echo "platform-validation=$PLATFORM_VALIDATION mode=$CHANGE_MODE test-suite=$TEST_SUITE coverage-gate=$COVERAGE_GATE docs-only=$DOCS_ONLY"
          [ "$PLATFORM_VALIDATION" = "success" ] || { echo "::error::platform-validation did not succeed"; exit 1; }
          if [ "$CHANGE_MODE" = "full" ]; then
            [ "$TEST_SUITE" = "success" ] || { echo "::error::full serial test suite did not succeed"; exit 1; }
            [ "$COVERAGE_GATE" = "success" ] || { echo "::error::coverage gate did not succeed"; exit 1; }
          else
            [ "$CHANGE_MODE" = "roadmap-docs-only" ] || { echo "::error::unknown change mode"; exit 1; }
            [ "$DOCS_ONLY" = "success" ] || { echo "::error::roadmap-only validation did not succeed"; exit 1; }
          fi

  # The branch ruleset requires `build`, `compile` and `test`. Every other job is connected through
  # `needs`, which `check-every-ci-job-is-required.py` audits.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [change-scope, guards, offline-guards, platform-validation, compile, test, formula]
    # A skipped required context is not evidence. Run the explicit result checks after every
    # dependency outcome, including cancellations.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every gate must have passed
        env:
          GUARDS: ${{ needs.guards.result }}
          CHANGE_SCOPE: ${{ needs.change-scope.result }}
          OFFLINE_GUARDS: ${{ needs.offline-guards.result }}
          PLATFORM_VALIDATION: ${{ needs.platform-validation.result }}
          COMPILE: ${{ needs.compile.result }}
          TEST: ${{ needs.test.result }}
          FORMULA: ${{ needs.formula.result }}
        run: |
          echo "change-scope=$CHANGE_SCOPE guards=$GUARDS offline-guards=$OFFLINE_GUARDS platform-validation=$PLATFORM_VALIDATION compile=$COMPILE test=$TEST formula=$FORMULA"
          [ "$CHANGE_SCOPE" = "success" ] || { echo "::error::change-scope did not succeed"; exit 1; }
          [ "$GUARDS" = "success" ] || { echo "::error::guards did not succeed"; exit 1; }
          [ "$OFFLINE_GUARDS" = "success" ] || { echo "::error::offline-guards did not succeed"; exit 1; }
          [ "$PLATFORM_VALIDATION" = "success" ] || { echo "::error::platform-validation did not succeed"; exit 1; }
          [ "$COMPILE" = "success" ] || { echo "::error::compile did not succeed"; exit 1; }
          [ "$TEST" = "success" ] || { echo "::error::test did not succeed"; exit 1; }
          [ "$FORMULA" = "success" ] || { echo "::error::formula did not succeed"; exit 1; }
