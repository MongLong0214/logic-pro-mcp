name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The sorted test inventory is dealt round-robin into this many shards by
  # Scripts/ci-test-shard-manifest.py, and `test-shards` below runs one matrix job per shard.
  # The matrix literal must list exactly 0 .. TEST_SHARD_COUNT-1 (an Actions matrix cannot read
  # `env`); a missing shard fails product-validation and an extra one fails its own job.
  # Measured on run 45950480151 at 8077 tests: the serial suite took 2572 s in total, one suite
  # (Issue965HeldSelectionAssociationTests) alone took 808 s, so a split by suite cannot run
  # faster than 808 s, while dealing tests round-robin spreads that suite over every shard. The
  # same timings give the slowest of 2 / 3 / 4 / 5 shards as 1305 / 918 / 682 / 560 s. Four
  # leaves one of the five macOS jobs an account may run at once free; each shard also costs about
  # two minutes of checkout, artifact download and extraction that does not shrink with it.
  TEST_SHARD_COUNT: '4'

# Every macOS job below runs on `macos-15`, an arm64 image: the architecture the product ships
# to and the native Logic host qualifies. The compile and the test run are architecture specific
# (a coverage profile is only meaningful against the binary that produced it, and the
# release-runtime artifact is the exact file native qualification runs), so the four jobs that
# share them must share one label. The `lipo -archs` assertions below fail the job if the label
# ever stops being arm64 instead of letting the evidence change silently.
# Measured on this repository's CI history, 2026-11-03 .. 2026-11-17: the identical coverage
# test-build compile step took a median of 37 minutes on the arm label (3 runs) and 85 minutes
# on the Intel one (33 runs), and a test-build job hit its 130-minute limit while compiling.
# Queue stalls and "not acquired" aborts occurred on both labels, overlapping in time on
# 2026-11-08 and 2026-11-11, so neither label is a cure for them and no label fallback is wired;
# the shorter job is what makes a lost attempt cheaper.
jobs:
  change-scope:
    name: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full-validation: ${{ steps.scope.outputs.full-validation }}
      native-required: ${{ steps.scope.outputs.native-required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode=full
          changes="$RUNNER_TEMP/change-scope.txt"
          # Canon, locale and other consumed documents are validation inputs. Only an
          # existing regular roadmap file's content edit can omit the Swift suites.
          # Capture the diff first so a Git failure cannot publish a successful scope.
          git diff --no-renames --raw --no-abbrev "$BASE_SHA" "$GITHUB_SHA" > "$changes"
          if [ "$(wc -l < "$changes")" -eq 1 ] &&
             LC_ALL=C grep -Eq '^:100644 100644 [0-9a-f]{40} [0-9a-f]{40} M[[:space:]]docs/roadmap/README[.]md$' "$changes"; then
            mode=docs-only
          fi
          if [ "$mode" = full ]; then full_validation=true; else full_validation=false; fi
          # Native Logic qualification covers the release binary built from Sources, so it is
          # required only when a change touches Sources/, Tests/, Package.swift or Package.resolved.
          # An empty diff or a symlink/submodule entry still requires it.
          native_required=true
          if [ -s "$changes" ] &&
             ! LC_ALL=C grep -Ev '^:(100644|100755|000000) (100644|100755|000000) [0-9a-f]{40} [0-9a-f]{40} [A-Z][[:space:]][^[:space:]]+$' "$changes" > /dev/null &&
             ! LC_ALL=C grep -Eq '^:[^[:space:]]+ [^[:space:]]+ [0-9a-f]{40} [0-9a-f]{40} [A-Z][[:space:]](Sources/|Tests/|Package[.]swift$|Package[.]resolved$)' "$changes"; then
            native_required=false
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "native-required=$native_required" >> "$GITHUB_OUTPUT"
          echo "full-validation=$full_validation" >> "$GITHUB_OUTPUT"

  # Canon and locale validation is intentionally independent of change-scope. A documentation
  # edit can alter a citation, observation or generated mapping just as readily as a source edit,
  # and a skipped required proof is not a pass.
  canon-locales:
    name: canon-locales
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify pinned Apple corpus, citations and every declared locale
        run: |
          set -euo pipefail
          python3 Scripts/logic_canon.py status
          python3 Scripts/check-canon-drift.py
          python3 Scripts/check-canon-citations.py
          python3 Scripts/check-canon-prose-numbers.py
          python3 Scripts/check-policy-literals-against-canon.py
          python3 Scripts/check-labelsets-are-derived.py
          python3 Scripts/check-new-labelsets-name-a-row.py
          python3 Scripts/check-labelset-census-only-shrinks.py
          python3 Scripts/check-locale-detection-is-derived.py
          python3 Scripts/check-locale-policy-coverage.py
          python3 Scripts/locale_labels.py --check
          python3 Scripts/check-locale-labels-json.py
          python3 Scripts/check-observation-records.py
          python3 Scripts/check-observation-ratchets.py
          python3 Scripts/check-observation-size.py

      - name: Mutation drives prove tampering, stale canon and wrong locale maps fail
        run: |
          set -euo pipefail
          tests=(
            Scripts/test_logic_canon.py
            Scripts/test_canon_citation_diagnostics.py
            Scripts/test_canon_citations_guard.py
            Scripts/test_canon_corrections.py
            Scripts/test_canon_drift.py
            Scripts/test_canon_presence.py
            Scripts/test_canon_prose_numbers.py
            Scripts/test_labelsets_are_derived.py
            Scripts/test_new_labelsets_name_a_row.py
            Scripts/test_locale_detection_is_derived.py
            Scripts/test_locale_campaign.py
            Scripts/test_locale_census.py
            Scripts/test_locale_rules.py
            Scripts/test_locale_campaign_script.py
            Scripts/test_observation_size.py
            Scripts/test_lfs_checkout.py
            Scripts/test_logic_build_drift_agent.py
            Scripts/test_locale_nav.py
            Scripts/test_locale_labels_json.py
            Scripts/test_locale_version_axis.py
            Scripts/test_policy_literals_against_canon.py
            Scripts/test_observation_records.py
            Scripts/test_observation_ratchets.py
            Scripts/test_release_verify_candidate.py
            Scripts/test_required_verification_workflow.py
          )
          for test_file in "${tests[@]}"; do
            python3 "$test_file"
          done

  release-build:
    name: release-build
    needs: change-scope
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-clt-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-clt-

      - name: Use Command Line Tools
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift
          uname -m
          sw_vers

      - name: Build release configuration
        run: |
          set -euo pipefail
          swift build -c release
          git diff --exit-code Package.resolved
          test -x .build/release/LogicProMCP
          test "$(lipo -archs .build/release/LogicProMCP)" = arm64
          mkdir -p "$RUNNER_TEMP/release-runtime"
          cp .build/release/LogicProMCP "$RUNNER_TEMP/release-runtime/LogicProMCP"
          git rev-parse HEAD > "$RUNNER_TEMP/release-runtime/candidate-sha.txt"

      - name: Publish release executable for fault-exclusion tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-runtime
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      # These offline guards and Python tests do not feed the Swift compile, so they run here, beside
      # the 34-minute `test-build`, after the release executable is published: a failed guard still
      # fails this job and so the required `build`, and it neither delays the coverage compile nor
      # suppresses this job's own compile. They ran at the head of `test-build` before, adding about
      # 1.1 minutes (guards 0.43, Python tests 0.52) to the critical path.
      - name: Product source guards
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          set -euo pipefail
          bash Scripts/ci-forbid-dead-expect.sh
          bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh

      - name: Run Python product tests in parallel
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        run: |
          set -euo pipefail
          tests=(
            Scripts/test_logic_ui_jxa.py
            Scripts/test_logic_variants.py
            Scripts/test_logic_session_bootstrap.py
            Scripts/test_logic_session_bootstrap_action.py
            Scripts/test_bounce_modules.py
            Scripts/test_logic_key_event.py
            Scripts/test_logic_controller_learn_mode.py
            Scripts/test_logic_free_tempo_modal.py
            Scripts/test_pure_logic_modules.py
            Scripts/test_live_e2e_bridge.py
            Scripts/test_ci_coverage_gate.py
            Scripts/test_ci_test_shard_manifest.py
            Scripts/test_ci_incremental_build.py
            Scripts/run-helper-suites.py
          )
          pids=()
          for test_file in "${tests[@]}"; do
            python3 "$test_file" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          test "$failed" -eq 0

  test-build:
    name: test-build
    needs: change-scope
    if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
    runs-on: macos-15
    timeout-minutes: 130
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      # The one definition of the build, used for the cache key and for the build itself, so a
      # changed flag cannot keep using a cache made with the old ones. The same line is in
      # test-build-cache.yml, which seeds the cache from main; a contract test keeps them equal.
      TEST_BUILD_COMMAND: swift build --build-tests --enable-code-coverage -Xswiftc -suppress-warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      # Whether the Formula's version is published, and whether its sha256 is that release's,
      # needs GitHub and a token, so it runs here rather than inside the unit suite. Native
      # qualification runs the unit suite with no GitHub credentials, and a unit test that asked
      # GitHub failed there with HTTP none. VersionConsistencyTests keeps the offline half.
      - name: Formula names the newest published release and its hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/ci-verify-formula-sha.sh

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-clt-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-clt-

      - name: Use Command Line Tools
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift
          uname -m
          sw_vers

      # Incremental test build. `.build` is restored from the newest cache that main saved
      # (test-build-cache.yml, which runs on every push to main that changes a build input) and
      # is never saved from here: GitHub lets a pull request read main's caches but not another
      # pull request's, and a cache per push would push main's out of the 10 GB limit. The key
      # names the runner image, the exact toolchain, the exact build command and the package
      # lock, so none of those can reuse another's products. Scripts/ci-incremental-build.sh
      # then restores each unchanged file's recorded mtime (a fresh checkout stamps everything
      # "now", which makes SwiftPM recompile all 508 test files) and lets `swift build` decide
      # the rest; if that build fails on a restored cache it is retried from a clean `.build`.
      - name: Name the incremental build cache
        id: build-cache
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the command is deliberately split into words
          echo "prefix=$(bash Scripts/ci-incremental-build.sh key $TEST_BUILD_COMMAND)" >> "$GITHUB_OUTPUT"

      - name: Restore the incremental build cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.prefix }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.build-cache.outputs.prefix }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Build one coverage runtime and exact shard manifests
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/test-runtime"
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-build-profraw"
          mkdir -p "$artifact" "$PROFRAW_DIR"
          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"
          # shellcheck disable=SC2086 # the command is deliberately split into words
          bash Scripts/ci-incremental-build.sh build $TEST_BUILD_COMMAND
          git diff --exit-code Package.resolved
          swift test list --skip-build > "$artifact/inventory-raw.txt"
          LC_ALL=C sort "$artifact/inventory-raw.txt" > "$artifact/inventory.txt"
          rm "$artifact/inventory-raw.txt"
          python3 Scripts/ci-test-shard-manifest.py partition \
            --inventory "$artifact/inventory.txt" \
            --shards "$TEST_SHARD_COUNT" \
            --output-directory "$artifact"

          triple_debug=$(readlink .build/debug)
          test_bundle=".build/$triple_debug/LogicProMCPPackageTests.xctest"
          test_binary="$test_bundle/Contents/MacOS/LogicProMCPPackageTests"
          test -x "$test_binary"
          test "$(lipo -archs "$test_binary")" = arm64
          test -x ".build/$triple_debug/LogicProMCP"
          tar -czf "$artifact/runtime.tar.gz" \
            .build/debug "$test_bundle" ".build/$triple_debug/LogicProMCP"
          git rev-parse HEAD > "$artifact/candidate-sha.txt"

      - name: Publish test runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/test-runtime
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-shards:
    name: test-shards (${{ matrix.shard }})
    needs: [change-scope, release-build, test-build]
    if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      - name: Use Command Line Tools
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-clt-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-clt-

      - name: Download test runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/test-runtime

      - name: Download release executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-runtime

      - name: Run this exact serial shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/test-runtime"
          out="$RUNNER_TEMP/test-shard-$SHARD"
          xunit_dir="$out/xunit"
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw-$SHARD"
          COVERAGE_LOG="$out/test.log"
          mkdir -p "$out" "$xunit_dir" "$PROFRAW_DIR"
          test "$SHARD" -ge 0
          test "$SHARD" -lt "$TEST_SHARD_COUNT"
          test "$(cat "$runtime/candidate-sha.txt")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/release-runtime/candidate-sha.txt")" = "$GITHUB_SHA"
          tar -xzf "$runtime/runtime.tar.gz" -C "$GITHUB_WORKSPACE"
          mkdir -p .build/release
          cp "$RUNNER_TEMP/release-runtime/LogicProMCP" .build/release/LogicProMCP
          chmod +x .build/release/LogicProMCP
          triple_debug=$(readlink .build/debug)
          test -x ".build/$triple_debug/LogicProMCPPackageTests.xctest/Contents/MacOS/LogicProMCPPackageTests"
          test -x ".build/$triple_debug/LogicProMCP"
          test -x .build/release/LogicProMCP
          swift test list --skip-build > "$RUNNER_TEMP/inventory-$SHARD-raw.txt"
          LC_ALL=C sort "$RUNNER_TEMP/inventory-$SHARD-raw.txt" > "$RUNNER_TEMP/inventory-$SHARD.txt"
          cmp "$runtime/inventory.txt" "$RUNNER_TEMP/inventory-$SHARD.txt"
          test -s "$runtime/shard-$SHARD.txt"
          test -s "$runtime/shard-$SHARD.filter"

          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"
          swift test --skip-build --enable-code-coverage --no-parallel \
            --xunit-output "$xunit_dir/results.xml" --filter "$(cat "$runtime/shard-$SHARD.filter")" \
            2>&1 | tee "$COVERAGE_LOG"
          python3 Scripts/ci-test-shard-manifest.py verify-xunit \
            --expected "$runtime/shard-$SHARD.txt" \
            --xunit-directory "$xunit_dir" \
            --actual "$out/actual-shard-$SHARD.txt"
          find .build -type f -path '*/debug/codecov/default.profdata' \
            > "$RUNNER_TEMP/profiles-$SHARD.txt"
          test "$(grep -c . "$RUNNER_TEMP/profiles-$SHARD.txt")" = 1
          cp "$(cat "$RUNNER_TEMP/profiles-$SHARD.txt")" "$out/shard-$SHARD.profdata"

      - name: Keep this shard's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/test-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  product-validation:
    name: product-validation
    needs: [change-scope, release-build, test-build, test-shards]
    if: always()
    runs-on: ${{ needs.change-scope.outputs.full-validation == 'true' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.product.outcome }}
      docs-only: ${{ steps.docs-only.outcome }}
    steps:
      - name: Validate documentation-only change
        id: docs-only
        if: ${{ needs.change-scope.outputs.full-validation != 'true' }}
        env:
          SCOPE: ${{ needs.change-scope.result }}
          MODE: ${{ needs.change-scope.outputs.mode }}
          RELEASE: ${{ needs.release-build.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
          SHARDS: ${{ needs.test-shards.result }}
        run: |
          set -euo pipefail
          test "$SCOPE" = success
          test "$MODE" = docs-only
          test "$RELEASE" = success
          test "$TEST_BUILD" = skipped
          test "$SHARDS" = skipped

      - name: Require complete product producers
        if: ${{ needs.change-scope.outputs.full-validation == 'true' }}
        env:
          SCOPE: ${{ needs.change-scope.result }}
          RELEASE: ${{ needs.release-build.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
          SHARDS: ${{ needs.test-shards.result }}
        run: |
          set -euo pipefail
          test "$SCOPE" = success
          test "$RELEASE" = success
          test "$TEST_BUILD" = success
          test "$SHARDS" = success

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        with:
          lfs: true
          fetch-depth: 0

      - name: Use Command Line Tools
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift

      - name: Download test runtime
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/test-runtime

      - name: Download every shard result
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/test-shards

      - name: Verify exact union and merge coverage
        id: product
        if: ${{ needs.change-scope.outputs.full-validation == 'true' && needs.release-build.result == 'success' && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/test-runtime"
          shards="$RUNNER_TEMP/test-shards"
          test "$(cat "$runtime/candidate-sha.txt")" = "$GITHUB_SHA"
          tar -xzf "$runtime/runtime.tar.gz" -C "$GITHUB_WORKSPACE"
          # Exactly one result and one profile per shard, and nothing else: a shard that did not
          # run, or a stray extra one, fails here instead of being left out of the union or merge.
          test "$(find "$shards" -type f -name 'actual-shard-*.txt' | grep -c .)" = "$TEST_SHARD_COUNT"
          test "$(find "$shards" -type f -name 'shard-*.profdata' | grep -c .)" = "$TEST_SHARD_COUNT"
          union_args=()
          profiles=()
          for ((shard = 0; shard < TEST_SHARD_COUNT; shard++)); do
            find "$shards" -type f -name "actual-shard-$shard.txt" > "$RUNNER_TEMP/actual-$shard-paths.txt"
            find "$shards" -type f -name "shard-$shard.profdata" > "$RUNNER_TEMP/profile-$shard-paths.txt"
            test "$(grep -c . "$RUNNER_TEMP/actual-$shard-paths.txt")" = 1
            test "$(grep -c . "$RUNNER_TEMP/profile-$shard-paths.txt")" = 1
            union_args+=(--shard "$(cat "$RUNNER_TEMP/actual-$shard-paths.txt")")
            profiles+=("$(cat "$RUNNER_TEMP/profile-$shard-paths.txt")")
          done
          python3 Scripts/ci-test-shard-manifest.py verify-union \
            --inventory "$runtime/inventory.txt" \
            "${union_args[@]}"

          triple_debug=$(readlink .build/debug)
          find .build -type d -name codecov -prune -exec rm -rf {} + 2>/dev/null || true
          mkdir -p ".build/$triple_debug/codecov"
          xcrun llvm-profdata merge -sparse \
            "${profiles[@]}" \
            -o ".build/$triple_debug/codecov/default.profdata"
          bash Scripts/ci-coverage-gate.sh

      - name: Keep combined coverage report
        if: ${{ always() && needs.change-scope.outputs.full-validation == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage-report.txt
            ${{ runner.temp }}/test-shards
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  # The trusted Logic host runs Scripts/ci-native-qualify.sh against this run's exact
  # release-runtime artifact. The authenticated exact-SHA status is consumed here; no mock,
  # hosted-runner skip or source-only substitute can produce success.
  native-logic-e2e:
    name: native-logic-e2e
    needs: [change-scope, release-build, product-validation]
    # Not always(): a job that always runs cannot be cancelled, so a superseded run sat in its
    # native wait for up to 180 minutes and held the concurrency group, leaving the new run
    # pending. `build` still requires this job's result to be success.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      actions: read
      contents: read
      statuses: read
    steps:
      - name: Require successful exact-artifact native Logic qualification
        if: ${{ needs.change-scope.outputs.native-required != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_WAIT_MINUTES: ${{ vars.NATIVE_WAIT_MINUTES || '180' }}
          EXPECTED_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
          RUN_ID: ${{ github.run_id }}
          PRODUCT_VALIDATION: ${{ needs.product-validation.result }}
        run: |
          set -euo pipefail
          test "$RELEASE_BUILD" = success
          test "$PRODUCT_VALIDATION" = success
          # Exit 3 from the consumer means "no native result yet" (no status, or pending, for
          # this attempt): keep this job (and so the run) active until the maintainer's
          # Scripts/ci-native-qualify.sh posts its result.
          deadline=$((SECONDS + NATIVE_WAIT_MINUTES * 60))
          while true; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/status?per_page=100" \
              > "$RUNNER_TEMP/combined-status.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/statuses?per_page=100" \
              > "$RUNNER_TEMP/status-pages.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
              > "$RUNNER_TEMP/artifacts.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
              > "$RUNNER_TEMP/run-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$EXPECTED_ATTEMPT" \
              > "$RUNNER_TEMP/run-attempt.json"
            set +e
            python3 - "$RUNNER_TEMP/combined-status.json" "$RUNNER_TEMP/status-pages.json" \
              "$RUNNER_TEMP/artifacts.json" \
              "$EXPECTED_SHA" "$EXPECTED_TARGET" "$EXPECTED_ATTEMPT" "$RUN_ID" \
              "$RUNNER_TEMP/run-jobs.json" "$RUNNER_TEMP/run-attempt.json" <<'PY'
          import json, re, sys
          status_response = json.load(open(sys.argv[1], encoding="utf-8"))
          status_pages = json.load(open(sys.argv[2], encoding="utf-8"))
          artifacts = json.load(open(sys.argv[3], encoding="utf-8")).get("artifacts", [])
          expected_sha, expected_target = sys.argv[4], sys.argv[5]
          expected_attempt, run_id = sys.argv[6], sys.argv[7]
          if status_response.get("sha") != expected_sha:
              raise SystemExit("combined native status response SHA mismatch")
          if not isinstance(status_pages, list) or not all(isinstance(page, list) for page in status_pages):
              raise SystemExit("full commit status pages have an unexpected shape")
          rows = [row for page in status_pages for row in page]
          # A failed-only rerun does not run release-build again, but the jobs API still lists it
          # under the current run_attempt with a new id and the ORIGINAL started_at/completed_at.
          # It ran in THIS attempt only if it started at or after this attempt's run_started_at;
          # then only this attempt's artifact is acceptable. Otherwise it is carried over and the
          # artifact belongs to the earliest attempt whose release-build has the same start and
          # end times (the attempt that really ran it), which must have succeeded. The status
          # below stays bound to the current attempt's target URL either way.
          from datetime import datetime
          def when(text):
              return datetime.fromisoformat(text.replace("Z", "+00:00"))
          jobs_pages = json.load(open(sys.argv[8], encoding="utf-8"))
          if not isinstance(jobs_pages, list) or not all(
                  isinstance(page, dict) and isinstance(page.get("jobs"), list)
                  for page in jobs_pages):
              raise SystemExit("workflow run jobs have an unexpected shape")
          run_started = when(json.load(open(sys.argv[9], encoding="utf-8")).get("run_started_at"))
          release_jobs = [job for page in jobs_pages for job in page["jobs"]
                          if job.get("name") == "release-build"]
          here = [job for job in release_jobs if job.get("run_attempt") == int(expected_attempt)]
          if len(here) > 1:
              raise SystemExit(f"expected at most one release-build job for attempt {expected_attempt}, found {len(here)}")
          artifact_attempt = expected_attempt
          if not here or when(here[0].get("started_at")) < run_started:
              def earlier(job):
                  return (isinstance(job.get("run_attempt"), int)
                          and not isinstance(job["run_attempt"], bool)
                          and 0 < job["run_attempt"] < int(expected_attempt)
                          and job.get("conclusion") == "success")
              if here:
                  origin = [job["run_attempt"] for job in release_jobs if earlier(job)
                            and job.get("started_at") == here[0].get("started_at")
                            and job.get("completed_at") == here[0].get("completed_at")]
              else:
                  # No entry for this attempt: release-build did not run; latest earlier success is carried over.
                  origin = [job["run_attempt"] for job in release_jobs if earlier(job)]
              if not origin:
                  raise SystemExit("carried-over release-build has no earlier successful attempt that ran it")
              if any(row.get("name") == f"release-runtime-{run_id}-{expected_attempt}"
                     for row in artifacts):
                  raise SystemExit("an artifact exists for this attempt, so an earlier attempt's is not used")
              artifact_attempt = str(min(origin) if here else max(origin))
          name = f"release-runtime-{run_id}-{artifact_attempt}"
          matches = [row for row in artifacts if row.get("name") == name]
          if len(matches) != 1:
              raise SystemExit(f"expected one current {name!r} artifact, found {len(matches)}")
          artifact = matches[0]
          artifact_id, digest = artifact.get("id"), artifact.get("digest")
          if artifact.get("expired") is not False:
              raise SystemExit("release runtime artifact is expired or has unknown expiry state")
          if isinstance(artifact_id, bool) or not isinstance(artifact_id, int) or artifact_id < 1:
              raise SystemExit("release runtime artifact id is not a positive integer")
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("release runtime artifact has no canonical SHA-256 digest")
          receipt = f"Native PASS a={expected_attempt} id={artifact_id} d={digest[7:]}"
          if len(receipt) > 140:
              raise SystemExit("native receipt exceeds GitHub's commit-status description limit")
          # Only statuses for THIS run attempt count: an older attempt's status (any state) is
          # ignored, never accepted and never a reason to fail. Newest first, as the API returns.
          exact = [row for row in rows
                   if row.get("context") == "logic-native-e2e"
                   and row.get("target_url") == expected_target]
          if not exact:
              print("missing exact native status; run Scripts/ci-native-qualify.sh "
                    f"for candidate {expected_sha} and run {run_id} on the trusted Logic host",
                    file=sys.stderr)
              raise SystemExit(3)
          latest = exact[0]
          if latest.get("state") == "pending":
              print("native qualification is still running for this run attempt; waiting",
                    file=sys.stderr)
              raise SystemExit(3)
          if latest.get("state") != "success":
              raise SystemExit(f"native status is {latest.get('state')!r}, not success")
          if latest.get("description") != receipt:
              raise SystemExit("native status does not bind the current artifact id and digest")
          creator = latest.get("creator") or {}
          if creator.get("login") != "MongLong0214" or creator.get("id") != 97578200:
              raise SystemExit("native status was not published by the trusted repository owner")
          print("Current run-attempt artifact passed native Logic qualification")
          PY
            rc=$?
            set -e
            test "$rc" -eq 0 && exit 0
            test "$rc" -eq 3 || exit "$rc"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timed out after $NATIVE_WAIT_MINUTES minutes without a native status" >&2
              exit 1
            fi
            sleep 60
          done

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [change-scope, canon-locales, native-logic-e2e, product-validation]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Product validation must pass
        env:
          SCOPE: ${{ needs.change-scope.result }}
          CANON_LOCALES: ${{ needs.canon-locales.result }}
          MODE: ${{ needs.change-scope.outputs.mode }}
          NATIVE_LOGIC: ${{ needs.native-logic-e2e.result }}
          VALIDATION: ${{ needs.product-validation.result }}
          PRODUCT: ${{ needs.product-validation.outputs.outcome }}
          DOCS_ONLY: ${{ needs.product-validation.outputs.docs-only }}
        run: |
          set -euo pipefail
          test "$SCOPE" = success
          test "$CANON_LOCALES" = success
          test "$NATIVE_LOGIC" = success
          test "$VALIDATION" = success
          if [ "$MODE" = full ]; then
            test "$PRODUCT" = success
          else
            test "$MODE" = docs-only
            test "$DOCS_ONLY" = success
          fi
