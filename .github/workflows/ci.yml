name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is NOT in the default set (opened, synchronize, reopened), and it is subscribed for
    # ONE reason: RETARGETING a pull request arrives as `edited` -- there is no separate event for
    # it -- and a change that now merges into a different branch has not been validated against the
    # branch it now merges into.
    #
    # It used to be here for the pull request BODY check as well. That check is
    # `.github/workflows/pr-policy.yml` now and `pr-policy` is a required context in its own right
    # (added to ruleset 19060230 and re-read from the API on 2026-09-21), so editing a description
    # re-runs that workflow and not this one.
    #
    # What stops a title edit from restarting a macOS test job is `classify` below, not this list:
    # an event filter cannot tell a retarget from a typo fix, because both are `edited`.
    types: [opened, synchronize, reopened, edited]

# Least privilege: the build job only reads the repo. Declaring the scope here
# (release.yml / publish-mcp.yml already pin theirs) drops the default token
# from read/write to read-only for every job in this workflow.
permissions:
  contents: read

concurrency:
  # TWO cancellation domains, because a description edit cancelling a running macOS test job is the
  # defect this workflow was carrying. This expression is evaluated before any job runs, so it
  # cannot call `classify` and has to repeat the conservative half of the same rule itself: a run
  # enters the metadata domain only when the payload positively says a title or a body changed AND
  # says nothing about the base. A push and a retarget are code runs and share the code domain, so
  # a newer commit still supersedes an older run of itself. Erring the other way would put a run
  # that DOES validate code in a domain a later typo fix can cancel.
  #
  # It is NOT identical to `classify`, and the difference is worth naming rather than papering
  # over. The classifier asks "does `changes` contain ONLY title and body?"; an expression cannot
  # enumerate an object's keys, so this asks after each known key by name instead. On every
  # payload GitHub documents for `edited` -- `changes` carries `title`, `body` and `base` and
  # nothing else -- the two agree, and `Scripts/test_pull_request_event_classifier.py` evaluates
  # this very string against every one of those payloads to say so. An `edited`
  # carrying some key GitHub does not document today would be `code` to the classifier and
  # `metadata` here. That residue fails in the safe direction -- such a run could be cancelled by a
  # later description edit, and a cancelled check is not a satisfied one, so the merge stays
  # blocked and the run has to be retriggered -- but it is a divergence, not a guarantee. Growing
  # `METADATA_KEYS` means editing this expression too, and a case fails if only one of them moves.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request' &&
    github.event.action == 'edited' && github.event.changes.base == null &&
    (github.event.changes.title != null || github.event.changes.body != null)) && 'metadata' ||
    'code' }}
  cancel-in-progress: true

# The DEFAULT shell for a `run:` block is `bash -e {0}` -- no `pipefail`. So `a | tee log` reports
# tee's exit code and a failing `a` reads as success, which is the shape of defect that lets a red
# test suite finish green. Naming `bash` selects GitHub's `bash --noprofile --norc -eo pipefail`,
# which is the same thing with the pipeline failure preserved. `-u` is deliberately not added: it
# is not what the default gives either, and turning it on globally is a different change.
defaults:
  run:
    shell: bash

jobs:
  # Does this event need code validation at all, or did somebody edit a description?
  #
  # The rule is in `Scripts/classify-pull-request-event.py` and the cases that drive it are in
  # `Scripts/test_pull_request_event_classifier.py`. It answers `metadata-only` for exactly one
  # shape -- a `pull_request` `edited` whose `changes` names title and/or body and nothing else --
  # and `code` for everything else, including an `edited` carrying `changes.base` (a retarget),
  # an `edited` with no `changes` at all, and an `edited` naming a key the script has not been
  # taught. A future editable field must not inherit the exemption by saying nothing.
  #
  # THE JOBS BELOW CHANGE THEIR NAME AND NOT ONLY THEIR CONDITION, and that is the whole safety
  # argument. A job skipped by an `if:` still publishes a check run under its own name, and GitHub
  # counts a `skipped` required check as SATISFIED -- so the obvious form of this optimisation
  # would let a title edit publish `compile: skipped` over a real `compile: failure` on the same
  # head commit and open the merge. Publishing under a name that is not a required context leaves
  # the code run's verdicts exactly where they were.
  #
  # MEASURED 2026-09-21, and not what the author expected: a job GitHub SKIPS does not have its
  # `name:` expression evaluated at all. Run 35569321799 (a `pull_request` `edited` on #952)
  # published five check runs named with the RAW EXPRESSION BODY --
  # `needs.classify.outputs.code_validation_required == 'true' && 'test' || 'test (not a code gate
  # - metadata-only edit)'` and its four siblings -- each `skipped`. Run 35569251102, the code run
  # on the same head `bd1745b7` where these jobs actually executed, published `compile`, `test`,
  # `guards` and `formula`. So the expression evaluates when the job runs and is left verbatim when
  # it does not, and the safety argument survives BOTH readings: evaluated, the name is the
  # parenthesised one; unevaluated, it is the expression itself; neither is `compile` or `test`,
  # and branch protection matches a context by exact name. The parenthesised branch is the one a
  # human is meant to read, and on current GitHub behaviour a human never sees it.
  #
  # Do not "simplify" this to a plain string because the pretty half never appears in the UI. The
  # plain string IS the canonical name, and publishing `skipped` under it is the whole hazard.
  #
  # It also decides nothing on its own behalf: if this job fails, its dependents are skipped for
  # want of a satisfied `needs`, they publish under a name that is not a required context by the
  # same mechanism, and the required contexts are simply absent for that commit. Absent is not
  # satisfied.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_validation_required: ${{ steps.decide.outputs.code_validation_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: decide
        name: Classify this event
        # The payload is read from the FILE GitHub writes, by the script, from
        # `GITHUB_EVENT_PATH`. A title and a body are attacker-controlled strings and neither is
        # interpolated into this shell -- nothing here even names them.
        #
        # `|| DECISION=unclassified` rather than letting the failure stop the step: an unreadable
        # or unexpected answer must mean "validate the code", not "decide nothing". Only the exact
        # token `metadata-only` turns validation off, and every other string, including the empty
        # one, falls through to `true`.
        run: |
          DECISION=$(python3 Scripts/classify-pull-request-event.py) || DECISION=unclassified
          if [ "$DECISION" = "metadata-only" ]; then
            REQUIRED=false
          else
            REQUIRED=true
          fi
          echo "decision=$DECISION code_validation_required=$REQUIRED"
          echo "code_validation_required=$REQUIRED" >> "$GITHUB_OUTPUT"

  # WAS `roadmap`, and carried four things: two that compare GitHub issue state against
  # `docs/roadmap/README.md` and the ADR index, and two about the Homebrew Formula. Only the
  # second pair protects the product -- a wrong `sha256` is `brew install` failing for everyone --
  # and only the second pair belongs in front of a merge.
  #
  # The status checks moved to `.github/workflows/maintenance.yml`, manual and weekly. They still
  # FAIL there; they no longer stop an unrelated code change. Keeping them here meant a stale
  # roadmap row blocked a merge that had nothing to do with the roadmap, which is the cost the
  # instruction to separate them names.
  formula:
    name: "${{ needs.classify.outputs.code_validation_required == 'true' && 'formula' || 'formula (not a code gate - metadata-only edit)' }}"
    needs: [classify]
    if: needs.classify.outputs.code_validation_required == 'true'
    # `classify` decides whether this event needs code validation at all, and the DISPLAY NAME
    # above is the half that makes the skip safe: on a metadata-only edit this job publishes a
    # check run that is not a required context, so the verdict the code run left on this commit
    # stands. Skipping under the canonical name would publish `skipped`, and GitHub counts a
    # skipped required check as satisfied. What GitHub actually published for both branches of
    # this expression is measured above `classify`; read it before rewriting this line.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Formula sha256 matches the release its version names (#775)
        # It runs on every build rather than only when `Formula/` changed. Not because the base is
        # unreachable — the checkout above is now full — but because the answer can go stale
        # without the file moving at all: it is a claim about a RELEASE, not about this tree, so
        # gating it on a diff would skip exactly the builds where it has newly become wrong.
        #
        # It cannot live in `run-repo-guards.py`: only the published release can answer whether
        # the hash is right, and the runner has no network/GitHub-authentication contract. Its
        # OFFLINE half does live there --
        # `Scripts/test_ci_verify_formula_sha.py` drives every classification through a fake `gh`.
        #
        # This is a merge gate and not a maintenance check, which is the line the roadmap and ADR
        # steps were moved across: a wrong `sha256` here is `brew install` failing for every user,
        # and that is a defect in what this repository ships rather than a bookkeeping drift.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/ci-verify-formula-sha.sh


  # Platform-independent shell integrity checks. The discovered Python runner runs in the macOS
  # `test` job: #896 adds `test_logic_key_event.py`, whose Swift subprocess imports AppKit. Keeping
  # that runner out of this Ubuntu job preserves the measured platform-independent shell boundary.
  guards:
    name: "${{ needs.classify.outputs.code_validation_required == 'true' && 'guards' || 'guards (not a code gate - metadata-only edit)' }}"
    needs: [classify]
    if: needs.classify.outputs.code_validation_required == 'true'
    # `classify` decides whether this event needs code validation at all, and the DISPLAY NAME
    # above is the half that makes the skip safe: on a metadata-only edit this job publishes a
    # check run that is not a required context, so the verdict the code run left on this commit
    # stands. Skipping under the canonical name would publish `skipped`, and GitHub counts a
    # skipped required check as satisfied. What GitHub actually published for both branches of
    # this expression is measured above `classify`; read it before rewriting this line.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Forbid dead boolean #expect (#393 test-integrity)
        # `#expect(<Bool> == true/false)` and kin pass unconditionally on this toolchain — they
        # prove nothing. Fail fast (no Xcode needed) before the build if any reappear.
        run: bash Scripts/ci-forbid-dead-expect.sh

      - name: Self-test the menu-literal guard (#519)
        # A guard nobody has watched fail is decoration. This asserts each known evasion is caught, that
        # legitimate code is not flagged, and that a tree the guard cannot examine is never reported
        # clean — the failure the guard itself had before review.
        run: bash Scripts/test-menu-literal-guard.sh

      - name: Self-test the typechecker-heavy-literal guard (#749)
        # Fixtures prove a three-concatenation value is refused and that unrelated one-concatenation
        # values, comments, and plain literals remain accepted.
        run: bash Scripts/test-typechecker-heavy-literal-guard.sh

      - name: Forbid hard-coded menu-bar item literals (#519 locale-routing)
        # A literal `menu bar item "..."` cannot reach the extra locale variants
        # AXLocalePolicy already records for that menu. Fail fast before the build if one
        # reappears — see the script for the full rationale.
        run: bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh


  compile:
    name: "${{ needs.classify.outputs.code_validation_required == 'true' && 'compile' || 'compile (not a code gate - metadata-only edit)' }}"
    needs: [classify]
    if: needs.classify.outputs.code_validation_required == 'true'
    # `classify` decides whether this event needs code validation at all, and the DISPLAY NAME
    # above is the half that makes the skip safe: on a metadata-only edit this job publishes a
    # check run that is not a required context, so the verdict the code run left on this commit
    # stands. Skipping under the canonical name would publish `skipped`, and GitHub counts a
    # skipped required check as satisfied. What GitHub actually published for both branches of
    # this expression is measured above `classify`; read it before rewriting this line.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Cache SwiftPM and build products
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos15-xcode164-release-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-macos15-xcode164-release-

      - name: Select Xcode and say which toolchain this is
        # The pin is Xcode 16.4, required by swift-sdk 0.11.0+ which adopts the short-form
        # `withThrowingTaskGroup { ... }` syntax that the previous 16.2 pin cannot compile.
        #
        # The comment here used to assert "Xcode 16.4 ships Swift 6.2". Apple's own version table
        # says 6.1, so one of the two was wrong and neither was measured -- and a wrong version in
        # a comment is what the next person reads when deciding whether to move the pin. The step
        # prints the toolchain instead of describing it, so the log answers the question and the
        # comment does not have to.
        #
        # This is a correction to a DESCRIPTION. It changes no version and moves no pin.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Build
        run: swift build -c release

      - name: Verify Package.resolved is unchanged
        run: git diff --exit-code Package.resolved


  test:
    name: "${{ needs.classify.outputs.code_validation_required == 'true' && 'test' || 'test (not a code gate - metadata-only edit)' }}"
    needs: [classify]
    if: needs.classify.outputs.code_validation_required == 'true'
    # `classify` decides whether this event needs code validation at all, and the DISPLAY NAME
    # above is the half that makes the skip safe: on a metadata-only edit this job publishes a
    # check run that is not a required context, so the verdict the code run left on this commit
    # stands. Skipping under the canonical name would publish `skipped`, and GitHub counts a
    # skipped required check as satisfied. What GitHub actually published for both branches of
    # this expression is measured above `classify`; read it before rewriting this line.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Cache SwiftPM and build products
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos15-xcode164-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-macos15-xcode164-debug-

      - name: Select Xcode and say which toolchain this is
        # The pin is Xcode 16.4, required by swift-sdk 0.11.0+ which adopts the short-form
        # `withThrowingTaskGroup { ... }` syntax that the previous 16.2 pin cannot compile.
        #
        # The comment here used to assert "Xcode 16.4 ships Swift 6.2". Apple's own version table
        # says 6.1, so one of the two was wrong and neither was measured -- and a wrong version in
        # a comment is what the next person reads when deciding whether to move the pin. The step
        # prints the toolchain instead of describing it, so the log answers the question and the
        # comment does not have to.
        #
        # This is a correction to a DESCRIPTION. It changes no version and moves no pin.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Run the tests and collect coverage
        # H-4 (2026-05-08 enterprise review) closed in v3.4.0: re-armed the coverage gate.
        # Pre-fix this step disabled shell error handling and exited successfully, so coverage
        # regressions never blocked a merge -- exactly the bug that review caught.
        #
        # `if: always()` USED to sit here and is gone. It belongs on a step that must run after a
        # failure -- the artefact upload below -- and this is the step that decides. With it, a
        # failed `Select Xcode` was followed by a test run against whatever toolchain was left.
        #
        # The GATE itself moved to `Scripts/ci-coverage-gate.sh`. Inline, the only way to watch it
        # refuse anything was to push a branch whose coverage had actually dropped, so four of its
        # refusals had never been observed; `Scripts/test_ci_coverage_gate.py` now drives all of
        # them against a fake `llvm-cov`. What stays here is running the tests, which is the one
        # thing a fixture cannot stand in for.
        run: |
          set -euo pipefail
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw"
          COVERAGE_LOG="$RUNNER_TEMP/logicpromcp-coverage.log"
          mkdir -p "$PROFRAW_DIR"
          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"

          # `.build` is RESTORED FROM CACHE, and `default.profdata` lives inside it. A run whose
          # tests produced no profile would otherwise find the previous run's file and report its
          # coverage as this one's -- the cached answer to a question nobody asked again. Deleting
          # only the coverage output keeps the incremental build, which is what the cache is for.
          find .build -type d -name codecov -prune -exec rm -rf {} + 2>/dev/null || true

          swift test --enable-code-coverage -Xswiftc -suppress-warnings --no-parallel 2>&1 | tee "$COVERAGE_LOG"
          # Surfaced, and deliberately NOT the gate by itself: GitHub's macOS runner can emit
          # recoverable child-process profile warnings while still producing a valid
          # default.profdata. What decides is whether the gate below can read a report from it.
          PROFILE_WARNING_COUNT=$(grep -c "LLVM Profile Error" "$COVERAGE_LOG" || true)
          if [ "$PROFILE_WARNING_COUNT" != "0" ]; then
            echo "::warning::LLVM profile runtime reported $PROFILE_WARNING_COUNT warning(s); continuing to profdata/report validation."
            echo "::warning::LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE"
          fi
          echo "LLVM profile warnings: ${PROFILE_WARNING_COUNT:-0}." >> "$GITHUB_STEP_SUMMARY"

      - name: Guards and standalone drives (discovered, not listed)
        # This runs once, on macOS: #896's `test_logic_key_event.py` compiles a Swift file that
        # imports AppKit. The Ubuntu `guards` job remains shell-only and platform-independent.
        # The runner discovers new `test_*.py` drives, so adding one does not edit this workflow.
        # Its log is retained by the diagnostic upload below if any child fails.
        run: |
          status=0
          python3 Scripts/run-repo-guards.py > guard-run.log 2>&1 || status=$?
          cat guard-run.log
          exit "$status"

      # The three `logic_bounce_*_test.py` libraries have no `unittest.main()`, so discovery in
      # the runner would report success without executing cases. This collector imports them and
      # checks each module's committed case floor instead.
      - name: Non-executable bounce test libraries (#896)
        run: python3 Scripts/run-helper-suites.py

      - name: Coverage gate
        # Hard thresholds: 70% region, 78% line. 90% line is the project target and deliberately
        # NOT the hard gate -- setting it today would only make every release red. Both numbers
        # live in the script beside the comparison that uses them.
        run: bash Scripts/ci-coverage-gate.sh

      - name: Keep the test, guard, and coverage reports whatever happened
        # This is where `always()` belongs: after the step that decides, so a red gate leaves
        # behind the report that explains it. An upload that fails does not turn a failed test run
        # green -- this step's own result is not in `build`'s aggregate.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            guard-run.log
            coverage-report.txt
            ${{ runner.temp }}/logicpromcp-coverage.log
          retention-days: 7
          if-no-files-found: warn

      # The branch ruleset requires `build`, `compile` and `test` as contexts -- re-read 2026-09-18
  # via `gh api repos/MongLong0214/logic-pro-mcp/rulesets/19060230`: strict is on, the bypass list
  # is empty, and those three are the whole list. So `needs` is what makes every OTHER job able to
  # block a merge, which is what `check-every-ci-job-is-required.py` enforces.
  build:
    name: "${{ needs.classify.outputs.code_validation_required == 'true' && 'build' || 'build (not a code gate - metadata-only edit)' }}"
    runs-on: ubuntu-latest
    # `roadmap` joins this list in the same change that restores the job. The instruction three
    # lines above says to, and skipping it is how a restored gate becomes decoration: the job runs,
    # it can fail, and the only required context does not look at it. A stale roadmap, a drifted ADR
    # index or a wrong Formula sha256 would have turned `roadmap` red while `build` stayed green and
    # the ruleset permitted the merge. Found by review 2026-09-15.
    needs: [classify, guards, compile, test, formula]
    # `always()` so a FAILED need still reaches the decision below -- that is the point of this
    # job. `!cancelled()` so a CANCELLED RUN does not. `concurrency.cancel-in-progress` cancels the
    # previous run on every push, and this job then ran anyway, saw its cancelled needs, and left a
    # red `build` on the pull request while a healthy run was still in progress. It misled me twice
    # in one afternoon: `gh pr checks` shows the newest check run per NAME, so a superseded run's
    # failure sits on top of a run that has not finished. A cancelled run has no verdict to give.
    if: always() && !cancelled() && needs.classify.outputs.code_validation_required == 'true'
    timeout-minutes: 5
    steps:
      - name: Every gate must have passed
        # Each need spelled out and compared to `success`, rather than tested for truthiness:
        # `cancelled` and `skipped` are not success, and a dependency this list forgets is a job
        # that can go red while the only required context stays green -- which has happened here
        # three times and is what the required-gate guard under Scripts/ watches for.
        #
        # There is no longer a need that may legitimately be `skipped` here. The body check that
        # was -- it ran only on `pull_request`, because a pull request body is what it reads -- is
        # `pr-policy` now, a required context of its own, and this job does not depend on it: a
        # `jobs.needs` reference cannot cross workflows, and the branch ruleset is what links the
        # two required paths. `classify` runs on every event and is checked like the rest.
        env:
          CLASSIFY: ${{ needs.classify.result }}
          GUARDS: ${{ needs.guards.result }}
          COMPILE: ${{ needs.compile.result }}
          TEST: ${{ needs.test.result }}
          FORMULA: ${{ needs.formula.result }}
        run: |
          echo "classify=$CLASSIFY guards=$GUARDS compile=$COMPILE test=$TEST formula=$FORMULA"
          [ "$CLASSIFY" = "success" ] || { echo "::error::classify did not succeed"; exit 1; }
          [ "$GUARDS" = "success" ] || { echo "::error::guards did not succeed"; exit 1; }
          [ "$COMPILE" = "success" ] || { echo "::error::compile did not succeed"; exit 1; }
          [ "$TEST" = "success" ] || { echo "::error::test did not succeed"; exit 1; }
          [ "$FORMULA" = "success" ] || { echo "::error::formula did not succeed"; exit 1; }
