name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is NOT in the default set (opened, synchronize, reopened), and one job here reads
    # the pull request BODY. Without it that gate only ever saw the body as of the last push:
    # open a compliant pull request, let it go green, then edit the citations out, and nothing
    # re-ran. The rule named the body and the enforcement site was the push.
    #
    # Everything runs on an edit rather than the body job alone, because `build` refuses a
    # dependency whose result is `skipped` -- so narrowing this with an `if:` on compile and test
    # would turn the only required context red on every edit. The cost is a full run on an event
    # that happens rarely; the alternative is a gate that reads a body nobody re-checks.
    types: [opened, synchronize, reopened, edited]

# Least privilege: the build job only reads the repo. Declaring the scope here
# (release.yml / publish-mcp.yml already pin theirs) drops the default token
# from read/write to read-only for every job in this workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The DEFAULT shell for a `run:` block is `bash -e {0}` -- no `pipefail`. So `a | tee log` reports
# tee's exit code and a failing `a` reads as success, which is the shape of defect that lets a red
# test suite finish green. Naming `bash` selects GitHub's `bash --noprofile --norc -eo pipefail`,
# which is the same thing with the pipeline failure preserved. `-u` is deliberately not added: it
# is not what the default gives either, and turning it on globally is a different change.
defaults:
  run:
    shell: bash

jobs:
  # `docs/roadmap/README.md` declares itself the source of truth for what is open, and its update
  # rule ("the same PR that opens or closes an issue updates the table") is a convention until
  # something fails when it is not kept. This is that something.
  #
  # Its own job rather than a step in `compile`: the check reads issue state, so it needs a token
  # scope the build jobs do not have. Adding `issues: read` to the workflow-level `permissions`
  # would hand it to every job instead of the one that needs it. It is also not in
  # `run-repo-guards.py`, whose contract is plain Python needing neither Xcode nor a network.
  # A pull request body is not a file in the tree, so `check-canon-citations.py`'s tree-wide sweep
  # cannot see it -- and the two documents a change is actually reviewed through were therefore
  # exempt from the rule they are supposed to carry. `docs/canon/README.md` says every artefact
  # this repository produces cites Logic or says it cannot; without this job, "every artefact"
  # quietly meant "every file".
  #
  # Its own job because it needs the pull request body, which the build jobs have no reason to read.
  canon-citations-in-the-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The waiver ratchet compares against `git merge-base`, and a shallow clone has no base.
          # The guard fails outright under CI rather than degrading to comparing a file with itself.
          fetch-depth: 0

      - name: Citations in the tree bind to files this change touches
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The API, not `git diff`. The plumbing version assumed `actions/checkout` had created
          # `origin/$BASE` and that the merge ref resolved -- true for a same-repo pull request and
          # UNTESTED for one from a fork, which this repository takes. `gh pr view --json files`
          # answers the same question through ONE mechanism, verified against two real fork pull
          # requests (40 and 9 files). `test -s` keeps the empty case failing closed: an empty list
          # means the query failed, and an empty list used to reopen the opt-out.
          # PAGINATED, and counted. `gh pr view --json files` returns one page; a pull request
          # larger than that page silently narrows what this rule is aimed at, and the opt-out is
          # derived from the file list. The REST endpoint spells the field `filename` (GraphQL's
          # `path` returns nothing here and exits 0, which is how an empty list once slipped
          # through), and `changed_files` is what the count is checked against.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename' \
            > /tmp/pr-changed.txt
          test -s /tmp/pr-changed.txt
          EXPECTED=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json changedFiles -q .changedFiles)
          ACTUAL=$(wc -l < /tmp/pr-changed.txt | tr -d ' ')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::listed $ACTUAL changed file(s), the pull request reports $EXPECTED."
            echo "::error::A partial list narrows this rule to whatever happened to be on page one."
            exit 1
          fi
          python3 Scripts/check-canon-citations.py --changed /tmp/pr-changed.txt

      - name: The pull request body cites Logic, or says it states no fact about Logic
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > /tmp/pr-body.md
          # Whether this change may opt out is derived from what it TOUCHES, not from what its
          # description says about itself. Without the file list the opt-out is one sentence
          # anybody can type, and review walked through it three ways.
          # PAGINATED, and counted. `gh pr view --json files` returns one page; a pull request
          # larger than that page silently narrows what this rule is aimed at, and the opt-out is
          # derived from the file list. The REST endpoint spells the field `filename` (GraphQL's
          # `path` returns nothing here and exits 0, which is how an empty list once slipped
          # through), and `changed_files` is what the count is checked against.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename' \
            > /tmp/pr-changed.txt
          test -s /tmp/pr-changed.txt
          EXPECTED=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json changedFiles -q .changedFiles)
          ACTUAL=$(wc -l < /tmp/pr-changed.txt | tr -d ' ')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::listed $ACTUAL changed file(s), the pull request reports $EXPECTED."
            echo "::error::A partial list narrows this rule to whatever happened to be on page one."
            exit 1
          fi
          python3 Scripts/check-canon-citations.py \
            --text /tmp/pr-body.md --changed /tmp/pr-changed.txt

  # WAS `roadmap`, and carried four things: two that compare GitHub issue state against
  # `docs/roadmap/README.md` and the ADR index, and two about the Homebrew Formula. Only the
  # second pair protects the product -- a wrong `sha256` is `brew install` failing for everyone --
  # and only the second pair belongs in front of a merge.
  #
  # The status checks moved to `.github/workflows/maintenance.yml`, manual and weekly. They still
  # FAIL there; they no longer stop an unrelated code change. Keeping them here meant a stale
  # roadmap row blocked a merge that had nothing to do with the roadmap, which is the cost the
  # instruction to separate them names.
  formula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Formula sha256 matches the release its version names (#775)
        # It runs on every build rather than only when `Formula/` changed. Not because the base is
        # unreachable — the checkout above is now full — but because the answer can go stale
        # without the file moving at all: it is a claim about a RELEASE, not about this tree, so
        # gating it on a diff would skip exactly the builds where it has newly become wrong.
        #
        # It cannot live in `run-repo-guards.py`: that job's contract is plain Python needing
        # neither Xcode nor a network, and the only way to know a hash is right is to ask the
        # release what it published. Its OFFLINE half does live there --
        # `Scripts/test_ci_verify_formula_sha.py` drives every classification through a fake `gh`.
        #
        # This is a merge gate and not a maintenance check, which is the line the roadmap and ADR
        # steps were moved across: a wrong `sha256` here is `brew install` failing for every user,
        # and that is a defect in what this repository ships rather than a bookkeeping drift.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/ci-verify-formula-sha.sh


  # Every guard and headless drive, ONCE. They used to be five steps duplicated across `compile`
  # and `test`, which on the 2026-09-17 main run cost 13.3 minutes of the first and 11.7 of the
  # second -- most of both jobs, for the same answer twice.
  #
  # Ubuntu, and that is measured rather than assumed. Every one of the 57 discovered guards and
  # all four shell guards were run in a `python:3.12-slim` container on 2026-09-18: 55 passed and
  # the two that did not were the merge-base checks failing on a bind-mounted git WORKTREE, which
  # is an artefact of how the container saw `.git` and not a Linux difference. Nothing here shells
  # out to `plutil`, `xcrun`, `osascript` or `sed -i ''`.
  #
  # It does NOT gate `compile` and `test` -- all three start together. Serialising would add the
  # guard's wall time to the front of a 23-minute test job to save runner minutes on the runs that
  # fail, and the guards are now two minutes rather than thirteen, so there is little left to save.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Forbid dead boolean #expect (#393 test-integrity)
        # `#expect(<Bool> == true/false)` and kin pass unconditionally on this toolchain — they
        # prove nothing. Fail fast (no Xcode needed) before the build if any reappear.
        run: bash Scripts/ci-forbid-dead-expect.sh

      - name: Self-test the menu-literal guard (#519)
        # A guard nobody has watched fail is decoration. This asserts each known evasion is caught, that
        # legitimate code is not flagged, and that a tree the guard cannot examine is never reported
        # clean — the failure the guard itself had before review.
        run: bash Scripts/test-menu-literal-guard.sh

      - name: Self-test the typechecker-heavy-literal guard (#749)
        # Fixtures prove a three-concatenation value is refused and that unrelated one-concatenation
        # values, comments, and plain literals remain accepted.
        run: bash Scripts/test-typechecker-heavy-literal-guard.sh

      - name: Forbid hard-coded menu-bar item literals (#519 locale-routing)
        # A literal `menu bar item "..."` cannot reach the extra locale variants
        # AXLocalePolicy already records for that menu. Fail fast before the build if one
        # reappears — see the script for the full rationale.
        run: bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh


      - name: Guards and headless drives (discovered, not listed)
        # Each of these used to be its own step, duplicated across compile and test, and the file
        # conflicted on three consecutive PRs — every one appending at the same point. The runner
        # discovers Scripts/check-*.py and the test_*.py drives, so adding a guard no longer edits
        # this workflow. It prints each one and its result, its wall time, and runs them all before
        # reporting.
        #
        # `|| status=$?` rather than disabling errexit around the call. Both capture the exit
        # code; only one of them leaves error handling ON for every other line, and
        # `InstallScriptContractTests.swift` forbids turning it off anywhere in this file --
        # because doing that around a gate is the H-4 defect verbatim, where the coverage step
        # disabled it and exited 0 for months. A command on the left of `||` does not trip
        # errexit, so this needs no exemption and asks for none.
        #
        # That contract test is a plain substring check over this whole file, so it cannot tell
        # code from a comment: the first version of THIS comment quoted the forbidden line and
        # turned the test red while the code was already correct. Do not name it here.
        #
        # Redirected rather than piped through `tee`: `pipefail` makes `cmd | tee` correct today
        # and one shell setting away from not being.
        run: |
          status=0
          python3 Scripts/run-repo-guards.py > guard-run.log 2>&1 || status=$?
          cat guard-run.log
          exit "$status"

      - name: Keep the guard log whatever happened
        # `always()` belongs on diagnostics, not on the step that decides. If the run above failed,
        # this is the artefact somebody reads to find out which guard and why.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guards-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            guard-run.log
          retention-days: 7
          if-no-files-found: ignore

  compile:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Cache SwiftPM and build products
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos15-xcode164-release-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-macos15-xcode164-release-

      - name: Select Xcode and say which toolchain this is
        # The pin is Xcode 16.4, required by swift-sdk 0.11.0+ which adopts the short-form
        # `withThrowingTaskGroup { ... }` syntax that the previous 16.2 pin cannot compile.
        #
        # The comment here used to assert "Xcode 16.4 ships Swift 6.2". Apple's own version table
        # says 6.1, so one of the two was wrong and neither was measured -- and a wrong version in
        # a comment is what the next person reads when deciding whether to move the pin. The step
        # prints the toolchain instead of describing it, so the log answers the question and the
        # comment does not have to.
        #
        # This is a correction to a DESCRIPTION. It changes no version and moves no pin.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Build
        run: swift build -c release

      - name: Verify Package.resolved is unchanged
        run: git diff --exit-code Package.resolved


  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Cache SwiftPM and build products
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos15-xcode164-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-macos15-xcode164-debug-

      - name: Select Xcode and say which toolchain this is
        # The pin is Xcode 16.4, required by swift-sdk 0.11.0+ which adopts the short-form
        # `withThrowingTaskGroup { ... }` syntax that the previous 16.2 pin cannot compile.
        #
        # The comment here used to assert "Xcode 16.4 ships Swift 6.2". Apple's own version table
        # says 6.1, so one of the two was wrong and neither was measured -- and a wrong version in
        # a comment is what the next person reads when deciding whether to move the pin. The step
        # prints the toolchain instead of describing it, so the log answers the question and the
        # comment does not have to.
        #
        # This is a correction to a DESCRIPTION. It changes no version and moves no pin.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Run the tests and collect coverage
        # H-4 (2026-05-08 enterprise review) closed in v3.4.0: re-armed the coverage gate.
        # Pre-fix this step disabled shell error handling and exited successfully, so coverage
        # regressions never blocked a merge -- exactly the bug that review caught.
        #
        # `if: always()` USED to sit here and is gone. It belongs on a step that must run after a
        # failure -- the artefact upload below -- and this is the step that decides. With it, a
        # failed `Select Xcode` was followed by a test run against whatever toolchain was left.
        #
        # The GATE itself moved to `Scripts/ci-coverage-gate.sh`. Inline, the only way to watch it
        # refuse anything was to push a branch whose coverage had actually dropped, so four of its
        # refusals had never been observed; `Scripts/test_ci_coverage_gate.py` now drives all of
        # them against a fake `llvm-cov`. What stays here is running the tests, which is the one
        # thing a fixture cannot stand in for.
        run: |
          set -euo pipefail
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw"
          COVERAGE_LOG="$RUNNER_TEMP/logicpromcp-coverage.log"
          mkdir -p "$PROFRAW_DIR"
          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"

          # `.build` is RESTORED FROM CACHE, and `default.profdata` lives inside it. A run whose
          # tests produced no profile would otherwise find the previous run's file and report its
          # coverage as this one's -- the cached answer to a question nobody asked again. Deleting
          # only the coverage output keeps the incremental build, which is what the cache is for.
          find .build -type d -name codecov -prune -exec rm -rf {} + 2>/dev/null || true

          swift test --enable-code-coverage -Xswiftc -suppress-warnings --no-parallel 2>&1 | tee "$COVERAGE_LOG"
          # Surfaced, and deliberately NOT the gate by itself: GitHub's macOS runner can emit
          # recoverable child-process profile warnings while still producing a valid
          # default.profdata. What decides is whether the gate below can read a report from it.
          PROFILE_WARNING_COUNT=$(grep -c "LLVM Profile Error" "$COVERAGE_LOG" || true)
          if [ "$PROFILE_WARNING_COUNT" != "0" ]; then
            echo "::warning::LLVM profile runtime reported $PROFILE_WARNING_COUNT warning(s); continuing to profdata/report validation."
            echo "::warning::LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE"
          fi
          echo "LLVM profile warnings: ${PROFILE_WARNING_COUNT:-0}." >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        # Hard thresholds: 70% region, 78% line. 90% line is the project target and deliberately
        # NOT the hard gate -- setting it today would only make every release red. Both numbers
        # live in the script beside the comparison that uses them.
        run: bash Scripts/ci-coverage-gate.sh

      - name: Keep the test log and the coverage report whatever happened
        # This is where `always()` belongs: after the step that decides, so a red gate leaves
        # behind the report that explains it. An upload that fails does not turn a failed test run
        # green -- this step's own result is not in `build`'s aggregate.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-report.txt
            ${{ runner.temp }}/logicpromcp-coverage.log
          retention-days: 7
          if-no-files-found: warn

      # The branch ruleset requires `build`, `compile` and `test` as contexts -- re-read 2026-09-18
  # via `gh api repos/MongLong0214/logic-pro-mcp/rulesets/19060230`: strict is on, the bypass list
  # is empty, and those three are the whole list. So `needs` is what makes every OTHER job able to
  # block a merge, which is what `check-every-ci-job-is-required.py` enforces.
  build:
    runs-on: ubuntu-latest
    # `roadmap` joins this list in the same change that restores the job. The instruction three
    # lines above says to, and skipping it is how a restored gate becomes decoration: the job runs,
    # it can fail, and the only required context does not look at it. A stale roadmap, a drifted ADR
    # index or a wrong Formula sha256 would have turned `roadmap` red while `build` stayed green and
    # the ruleset permitted the merge. Found by review 2026-09-15.
    needs: [guards, compile, test, formula, canon-citations-in-the-pull-request]
    # `always()` so a FAILED need still reaches the decision below -- that is the point of this
    # job. `!cancelled()` so a CANCELLED RUN does not. `concurrency.cancel-in-progress` cancels the
    # previous run on every push, and this job then ran anyway, saw its cancelled needs, and left a
    # red `build` on the pull request while a healthy run was still in progress. It misled me twice
    # in one afternoon: `gh pr checks` shows the newest check run per NAME, so a superseded run's
    # failure sits on top of a run that has not finished. A cancelled run has no verdict to give.
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - name: Every gate must have passed
        # `canon-citations-in-the-pull-request` joins this list in the same change that adds the
        # job, for the reason written five lines above -- and it was left out of the first version
        # of that change anyway. The job ran, it could fail, and the only required context did not
        # look at it. That is the same defect this comment already records, committed again by the
        # change whose whole subject is enforcement sites drifting from named sites.
        #
        # It is the one gate here that can legitimately be SKIPPED: it runs only on
        # `pull_request`, because a pull request body is what it reads. A push has no body, so
        # `skipped` is accepted there and refused on a pull request -- spelled out rather than
        # folded into a truthy test, because `[ "" = "success" ]` and `[ "skipped" = "success" ]`
        # both read as "did not succeed" and only one of them is.
        env:
          EVENT: ${{ github.event_name }}
          GUARDS: ${{ needs.guards.result }}
          COMPILE: ${{ needs.compile.result }}
          TEST: ${{ needs.test.result }}
          FORMULA: ${{ needs.formula.result }}
          CANON: ${{ needs.canon-citations-in-the-pull-request.result }}
        run: |
          echo "guards=$GUARDS compile=$COMPILE test=$TEST formula=$FORMULA canon=$CANON event=$EVENT"
          # Each one spelled out, and each compared to `success` rather than tested for truthiness.
          # `cancelled` and `skipped` are not success, and a dependency this list forgets is a job
          # that can go red while the only required context stays green -- which has happened here
          # three times and is what `Scripts/check-every-ci-job-is-required.py` now watches for.
          [ "$GUARDS" = "success" ] || { echo "::error::guards did not succeed"; exit 1; }
          [ "$COMPILE" = "success" ] || { echo "::error::compile did not succeed"; exit 1; }
          [ "$TEST" = "success" ] || { echo "::error::test did not succeed"; exit 1; }
          [ "$FORMULA" = "success" ] || { echo "::error::formula did not succeed"; exit 1; }
          if [ "$EVENT" = "pull_request" ]; then
            [ "$CANON" = "success" ] || {
              echo "::error::canon-citations-in-the-pull-request did not succeed"; exit 1; }
          else
            [ "$CANON" = "skipped" ] || [ "$CANON" = "success" ] || {
              echo "::error::canon-citations-in-the-pull-request was neither skipped nor green"
              exit 1; }
          fi
