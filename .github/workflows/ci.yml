name: CI

on:
  # The default-branch ruleset is strict, permits merge commits only, and has no bypass actor.
  # Therefore the admitted main tree is the exact tree already exercised by this PR merge-candidate
  # workflow; replaying all three macOS jobs on the resulting merge only competes with the next PR.
  pull_request:
    branches: [main]
    # `edited` stays excluded: PR metadata must not replace code CI's required check suite.
    types: [opened, synchronize, reopened]

# Least privilege: the build job only reads the repo. Declaring the scope here
# (release.yml / publish-mcp.yml already pin theirs) drops the default token
# from read/write to read-only for every job in this workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The DEFAULT shell for a `run:` block is `bash -e {0}` -- no `pipefail`. So `a | tee log` reports
# tee's exit code and a failing `a` reads as success, which is the shape of defect that lets a red
# test suite finish green. Naming `bash` selects GitHub's `bash --noprofile --norc -eo pipefail`,
# which is the same thing with the pipeline failure preserved. `-u` is deliberately not added: it
# is not what the default gives either, and turning it on globally is a different change.
defaults:
  run:
    shell: bash

env:
  # SwiftPM applies this regex to an implementation-qualified name while `swift test list`
  # includes the module prefix. Keep the exact suite segment bounded by `.` and `/`, but do not
  # anchor either side: an anchored module-qualified pattern selects zero tests on Swift 6.2.
  TEST_SHARD_SELECTOR: '\.(QualificationRunnerTests|Issue965FreshPopulationAcquisitionTests|Issue538TrackCreationObservationTests|Issue968ExactTrackNameAdapterTests|QualificationFaultInjectionTests|MIDIReadbackCallSiteLintTests|Issue538ModalWitnessTests)/'

jobs:
  # WAS `roadmap`, and carried four things: two that compare GitHub issue state against
  # `docs/roadmap/README.md` and the ADR index, and two about the Homebrew Formula. Only the
  # second pair protects the product -- a wrong `sha256` is `brew install` failing for everyone --
  # and only the second pair belongs in front of a merge.
  #
  # The status checks moved to `.github/workflows/maintenance.yml`, manual and weekly. They still
  # FAIL there; they no longer stop an unrelated code change. Keeping them here meant a stale
  # roadmap row blocked a merge that had nothing to do with the roadmap, which is the cost the
  # instruction to separate them names.
  formula:
    name: formula
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Formula sha256 matches the release its version names (#775)
        # It runs on every build rather than only when `Formula/` changed. Not because the base is
        # unreachable — the checkout above is now full — but because the answer can go stale
        # without the file moving at all: it is a claim about a RELEASE, not about this tree, so
        # gating it on a diff would skip exactly the builds where it has newly become wrong.
        #
        # It cannot live in `run-repo-guards.py`: only the published release can answer whether
        # the hash is right, and the runner has no network/GitHub-authentication contract. Its
        # OFFLINE half does live there --
        # `Scripts/test_ci_verify_formula_sha.py` drives every classification through a fake `gh`.
        #
        # This is a merge gate and not a maintenance check, which is the line the roadmap and ADR
        # steps were moved across: a wrong `sha256` here is `brew install` failing for every user,
        # and that is a defect in what this repository ships rather than a bookkeeping drift.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/ci-verify-formula-sha.sh


  # Platform-independent shell integrity checks. The discovered Python runner runs in the macOS
  # `test` job: #896 adds `test_logic_key_event.py`, whose Swift subprocess imports AppKit. Keeping
  # that runner out of this Ubuntu job preserves the measured platform-independent shell boundary.

  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Forbid dead boolean #expect (#393 test-integrity)
        # `#expect(<Bool> == true/false)` and kin pass unconditionally on this toolchain — they
        # prove nothing. Fail fast (no Xcode needed) before the build if any reappear.
        run: bash Scripts/ci-forbid-dead-expect.sh

      - name: Self-test the menu-literal guard (#519)
        # A guard nobody has watched fail is decoration. This asserts each known evasion is caught, that
        # legitimate code is not flagged, and that a tree the guard cannot examine is never reported
        # clean — the failure the guard itself had before review.
        run: bash Scripts/test-menu-literal-guard.sh

      - name: Self-test the typechecker-heavy-literal guard (#749)
        # Fixtures prove a three-concatenation value is refused and that unrelated one-concatenation
        # values, comments, and plain literals remain accepted.
        run: bash Scripts/test-typechecker-heavy-literal-guard.sh

      - name: Forbid hard-coded menu-bar item literals (#519 locale-routing)
        # A literal `menu bar item "..."` cannot reach the extra locale variants
        # AXLocalePolicy already records for that menu. Fail fast before the build if one
        # reappears — see the script for the full rationale.
        run: bash Scripts/ci-forbid-hardcoded-menu-bar-item.sh

  offline-guards:
    name: offline-guards
    # This job builds no product artifact. Use the standard Intel image so the scarce arm64 pool
    # remains available for the release build and the exact test runtime below.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Scripts/requirements-ci.txt

      - name: Install guard dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/logic-pro-ci-venv"
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          python3 -m pip install --disable-pip-version-check -r Scripts/requirements-ci.txt
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Offline guards and standalone drives
        run: |
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          set -o pipefail
          python3 -u Scripts/run-repo-guards.py 2>&1 | tee guard-run.log

      - name: Non-executable bounce test libraries (#896)
        run: |
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          python3 Scripts/run-helper-suites.py

      - name: Keep guard log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-guards-${{ github.run_id }}-${{ github.run_attempt }}
          path: guard-run.log
          retention-days: 7
          if-no-files-found: warn

  compile-platform:
    name: compile-platform
    # The hosted pool abandoned a second macos-15 request after 15 queued minutes while test-build
    # held the available runner. Keep the longer test runtime build first, then request the release
    # build after it releases the runner; offline guards still run in parallel on macos-15-intel.
    # This preserves both platform validations without asking current capacity for two ARM runners.
    needs: [offline-guards, test-build]
    # An offline-guard or test-runtime-build defect must not hide release-build defects from the
    # same attempt. A hosted-capacity cancellation has no code result, so do not repeat its request;
    # ordinary producer failures release the runner and still permit the independent compile.
    # Positive allowlisting is deliberate: while GitHub's capacity manager still reports an
    # upstream job as queued, an empty result would pass a negative `!= cancelled` test.
    if: ${{ !cancelled() && (needs.offline-guards.result == 'success' || needs.offline-guards.result == 'failure') && (needs.test-build.result == 'success' || needs.test-build.result == 'failure') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Guards in this repository compare the branch against its merge base — the observation
          # ratchets are the load-bearing one: with a shallow clone the base is absent, so the
          # check degrades to comparing the branch against its own file and a commit that adds a
          # gap AND raises its own ceiling passes. The ratchet guard now fails outright when the
          # base is unreadable under CI, and this is what makes that satisfiable.
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode164-release-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode164-release-

      - name: Select Xcode and say which toolchain this is
        # The pin is Xcode 16.4, required by swift-sdk 0.11.0+ which adopts the short-form
        # `withThrowingTaskGroup { ... }` syntax that the previous 16.2 pin cannot compile.
        #
        # The comment here used to assert "Xcode 16.4 ships Swift 6.2". Apple's own version table
        # says 6.1, so one of the two was wrong and neither was measured -- and a wrong version in
        # a comment is what the next person reads when deciding whether to move the pin. The step
        # prints the toolchain instead of describing it, so the log answers the question and the
        # comment does not have to.
        #
        # This is a correction to a DESCRIPTION. It changes no version and moves no pin.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Build
        run: swift build -c release

      - name: Verify Package.resolved is unchanged
        run: git diff --exit-code Package.resolved

  compile:
    name: compile
    runs-on: ubuntu-latest
    needs: [offline-guards, compile-platform]
    # `compile` is a required context. Keep it unconditional so a cancelled/skipped macOS
    # producer cannot satisfy branch protection without release-build evidence.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Offline guards and the platform build must have passed
        env:
          OFFLINE_GUARDS: ${{ needs.offline-guards.result }}
          COMPILE_PLATFORM: ${{ needs.compile-platform.result }}
        run: |
          echo "offline-guards=$OFFLINE_GUARDS compile-platform=$COMPILE_PLATFORM"
          [ "$OFFLINE_GUARDS" = "success" ] || { echo "::error::offline-guards did not succeed"; exit 1; }
          [ "$COMPILE_PLATFORM" = "success" ] || { echo "::error::compile-platform did not succeed"; exit 1; }

  test-build:
    name: test-build
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode164-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode164-debug-

      - name: Select Xcode and say which toolchain this is
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Build one coverage runtime and exact shard manifests
        run: |
          set -euo pipefail
          ARTIFACT="$RUNNER_TEMP/test-runtime"
          mkdir -p "$ARTIFACT"
          swift build --build-tests --enable-code-coverage -Xswiftc -suppress-warnings
          swift test list --skip-build > "$ARTIFACT/inventory-raw.txt"
          LC_ALL=C sort "$ARTIFACT/inventory-raw.txt" > "$ARTIFACT/inventory.txt"
          rm "$ARTIFACT/inventory-raw.txt"
          python3 Scripts/ci-test-shard-manifest.py partition \
            --inventory "$ARTIFACT/inventory.txt" \
            --selector "$TEST_SHARD_SELECTOR" \
            --selected "$ARTIFACT/selected.txt" \
            --complement "$ARTIFACT/complement.txt"

          TRIPLE_DEBUG=$(readlink .build/debug)
          TEST_BUNDLE=".build/$TRIPLE_DEBUG/LogicProMCPPackageTests.xctest"
          TEST_BINARY="$TEST_BUNDLE/Contents/MacOS/LogicProMCPPackageTests"
          for executable in "$TEST_BINARY" ".build/$TRIPLE_DEBUG/LogicProMCP" \
              ".build/$TRIPLE_DEBUG/trusted-verifier"; do
            test -x "$executable"
          done
          {
            find "$TEST_BUNDLE" -type f -print
            printf '%s\n' ".build/$TRIPLE_DEBUG/LogicProMCP" \
              ".build/$TRIPLE_DEBUG/trusted-verifier"
          } | LC_ALL=C sort | while IFS= read -r path; do
            shasum -a 256 "$path"
          done > "$ARTIFACT/runtime-files.sha256"
          tar -czf "$ARTIFACT/logicpromcp-test-runtime.tar.gz" \
            .build/debug "$TEST_BUNDLE" \
            ".build/$TRIPLE_DEBUG/LogicProMCP" \
            ".build/$TRIPLE_DEBUG/trusted-verifier"
          git rev-parse HEAD > "$ARTIFACT/candidate-sha.txt"
          (cd "$ARTIFACT" && shasum -a 256 candidate-sha.txt inventory.txt selected.txt \
            complement.txt runtime-files.sha256 logicpromcp-test-runtime.tar.gz \
            > artifact.sha256)

      - name: Publish the hash-bound test runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-runtime
          retention-days: 1
          if-no-files-found: error

  test-shards:
    name: test-shards (${{ matrix.shard }})
    needs: [test-build, compile-platform]
    # Preserve independent test evidence after an ordinary release-build failure, but do not ask
    # for two more macOS runners when that producer was cancelled or skipped for hosted capacity.
    if: ${{ !cancelled() && needs.test-build.result == 'success' && (needs.compile-platform.result == 'success' || needs.compile-platform.result == 'failure') }}
    runs-on: macos-15
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: selected
            mode: filter
          - shard: complement
            mode: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Scripts/requirements-ci.txt

      - name: Install Swift test subprocess dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/logic-pro-ci-venv"
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          python3 -m pip install --disable-pip-version-check -r Scripts/requirements-ci.txt
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Cache SwiftPM downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode164-debug-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode164-debug-

      - name: Select Xcode and say which toolchain this is
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Download the exact test runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-runtime

      - name: Verify and run this exact shard
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          SHARD_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/logic-pro-ci-venv/bin/activate"
          RUNTIME="$RUNNER_TEMP/test-runtime"
          OUT="$RUNNER_TEMP/test-shard-$SHARD"
          XUNIT_DIR="$OUT/xunit"
          PROFRAW_DIR="$RUNNER_TEMP/logicpromcp-profraw-$SHARD"
          COVERAGE_LOG="$OUT/test.log"
          mkdir -p "$OUT" "$XUNIT_DIR" "$PROFRAW_DIR"
          test "$(cat "$RUNTIME/candidate-sha.txt")" = "$GITHUB_SHA"
          (cd "$RUNTIME" && shasum -a 256 -c artifact.sha256)
          tar -xzf "$RUNTIME/logicpromcp-test-runtime.tar.gz" -C "$GITHUB_WORKSPACE"
          shasum -a 256 -c "$RUNTIME/runtime-files.sha256"
          TRIPLE_DEBUG=$(readlink .build/debug)
          test -x ".build/$TRIPLE_DEBUG/LogicProMCPPackageTests.xctest/Contents/MacOS/LogicProMCPPackageTests"
          test -x ".build/$TRIPLE_DEBUG/LogicProMCP"
          test -x ".build/$TRIPLE_DEBUG/trusted-verifier"
          swift test list --skip-build > "$RUNNER_TEMP/inventory-$SHARD-raw.txt"
          LC_ALL=C sort "$RUNNER_TEMP/inventory-$SHARD-raw.txt" > "$RUNNER_TEMP/inventory-$SHARD.txt"
          cmp "$RUNTIME/inventory.txt" "$RUNNER_TEMP/inventory-$SHARD.txt"

          export LLVM_PROFILE_FILE="$PROFRAW_DIR/%m-%p.profraw"
          if [ "$SHARD_MODE" = "filter" ]; then
            swift test --skip-build --enable-code-coverage --no-parallel \
              --xunit-output "$XUNIT_DIR/results.xml" --filter "$TEST_SHARD_SELECTOR" \
              2>&1 | tee "$COVERAGE_LOG"
          else
            swift test --skip-build --enable-code-coverage --no-parallel \
              --xunit-output "$XUNIT_DIR/results.xml" --skip "$TEST_SHARD_SELECTOR" \
              2>&1 | tee "$COVERAGE_LOG"
          fi
          python3 Scripts/ci-test-shard-manifest.py verify-xunit \
            --expected "$RUNTIME/$SHARD.txt" \
            --xunit-directory "$XUNIT_DIR" \
            --actual "$OUT/actual-$SHARD.txt"
          find .build -type f -path '*/debug/codecov/default.profdata' \
            > "$RUNNER_TEMP/profiles-$SHARD.txt"
          test "$(grep -c . "$RUNNER_TEMP/profiles-$SHARD.txt")" = "1"
          cp "$(cat "$RUNNER_TEMP/profiles-$SHARD.txt")" "$OUT/$SHARD.profdata"
          # SwiftPM versions may suffix the requested xUnit basename. The verifier already proved
          # this empty, shard-private directory contains exactly one XML file; hashing the glob
          # preserves its actual basename in the evidence instead of guessing a toolchain name.
          (cd "$OUT" && shasum -a 256 "actual-$SHARD.txt" "$SHARD.profdata" \
            test.log xunit/*.xml > shard-files.sha256)

      - name: Publish this shard's verified evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-shard-${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: warn

  test-coverage:
    name: test-coverage
    needs: [test-build, test-shards]
    # Do not request a third macOS runner after either producer was cancelled for hosted capacity.
    # The required Ubuntu `test` aggregate below turns every skip/cancel/failure into a red context.
    if: ${{ !cancelled() && needs.test-build.result == 'success' && needs.test-shards.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select Xcode and say which toolchain this is
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version
          xcrun --find swift
          uname -m
          sw_vers

      - name: Download the exact test runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-runtime

      - name: Download both verified shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-shards

      - name: Verify the union and merge only its profiles
        run: |
          set -euo pipefail
          RUNTIME="$RUNNER_TEMP/test-runtime"
          SHARDS="$RUNNER_TEMP/test-shards"
          test "$(cat "$RUNTIME/candidate-sha.txt")" = "$GITHUB_SHA"
          (cd "$RUNTIME" && shasum -a 256 -c artifact.sha256)
          tar -xzf "$RUNTIME/logicpromcp-test-runtime.tar.gz" -C "$GITHUB_WORKSPACE"
          shasum -a 256 -c "$RUNTIME/runtime-files.sha256"
          find "$SHARDS" -type f -name actual-selected.txt > "$RUNNER_TEMP/selected-paths.txt"
          find "$SHARDS" -type f -name actual-complement.txt > "$RUNNER_TEMP/complement-paths.txt"
          test "$(grep -c . "$RUNNER_TEMP/selected-paths.txt")" = "1"
          test "$(grep -c . "$RUNNER_TEMP/complement-paths.txt")" = "1"
          SELECTED_DIR=$(dirname "$(cat "$RUNNER_TEMP/selected-paths.txt")")
          COMPLEMENT_DIR=$(dirname "$(cat "$RUNNER_TEMP/complement-paths.txt")")
          (cd "$SELECTED_DIR" && shasum -a 256 -c shard-files.sha256)
          (cd "$COMPLEMENT_DIR" && shasum -a 256 -c shard-files.sha256)
          python3 Scripts/ci-test-shard-manifest.py verify-union \
            --inventory "$RUNTIME/inventory.txt" \
            --selected "$SELECTED_DIR/actual-selected.txt" \
            --complement "$COMPLEMENT_DIR/actual-complement.txt"

          TRIPLE_DEBUG=$(readlink .build/debug)
          find .build -type d -name codecov -prune -exec rm -rf {} + 2>/dev/null || true
          PROFILE_DIR="$RUNNER_TEMP/shard-profiles"
          mkdir -p "$PROFILE_DIR" ".build/$TRIPLE_DEBUG/codecov"
          cp "$SELECTED_DIR/selected.profdata" "$PROFILE_DIR/selected.profdata"
          cp "$COMPLEMENT_DIR/complement.profdata" "$PROFILE_DIR/complement.profdata"
          xcrun llvm-profdata merge -sparse "$PROFILE_DIR/selected.profdata" \
            "$PROFILE_DIR/complement.profdata" \
            -o ".build/$TRIPLE_DEBUG/codecov/default.profdata"

      - name: Coverage gate
        run: bash Scripts/ci-coverage-gate.sh

      - name: Keep the combined coverage evidence whatever happened
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-report.txt
            ${{ runner.temp }}/test-shards
          retention-days: 7
          if-no-files-found: warn

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [test-build, test-shards, test-coverage]
    # This required context must run after cancellation: GitHub treats a conditional skip as
    # successful, so the result checks — not the job condition — carry the fail-closed decision.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every test producer must have passed
        env:
          TEST_BUILD: ${{ needs.test-build.result }}
          TEST_SHARDS: ${{ needs.test-shards.result }}
          TEST_COVERAGE: ${{ needs.test-coverage.result }}
        run: |
          echo "test-build=$TEST_BUILD test-shards=$TEST_SHARDS test-coverage=$TEST_COVERAGE"
          [ "$TEST_BUILD" = "success" ] || { echo "::error::test-build did not succeed"; exit 1; }
          [ "$TEST_SHARDS" = "success" ] || { echo "::error::test-shards did not succeed"; exit 1; }
          [ "$TEST_COVERAGE" = "success" ] || { echo "::error::test-coverage did not succeed"; exit 1; }

      # The branch ruleset requires `build`, `compile` and `test` as contexts -- re-read 2026-09-18
  # via `gh api repos/MongLong0214/logic-pro-mcp/rulesets/19060230`: strict is on, the bypass list
  # is empty, and those three are the whole list. So `needs` is what makes every OTHER job able to
  # block a merge, which is what `check-every-ci-job-is-required.py` enforces.

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [guards, offline-guards, compile-platform, compile, test-build, test-shards, test-coverage, test, formula]
    # The aggregate is also required, so cancellation must reach its explicit result checks rather
    # than turn the job into a successful skip.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every gate must have passed
        env:
          GUARDS: ${{ needs.guards.result }}
          OFFLINE_GUARDS: ${{ needs.offline-guards.result }}
          COMPILE_PLATFORM: ${{ needs.compile-platform.result }}
          COMPILE: ${{ needs.compile.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
          TEST_SHARDS: ${{ needs.test-shards.result }}
          TEST_COVERAGE: ${{ needs.test-coverage.result }}
          TEST: ${{ needs.test.result }}
          FORMULA: ${{ needs.formula.result }}
        run: |
          echo "guards=$GUARDS offline-guards=$OFFLINE_GUARDS compile-platform=$COMPILE_PLATFORM compile=$COMPILE test-build=$TEST_BUILD test-shards=$TEST_SHARDS test-coverage=$TEST_COVERAGE test=$TEST formula=$FORMULA"
          [ "$GUARDS" = "success" ] || { echo "::error::guards did not succeed"; exit 1; }
          [ "$OFFLINE_GUARDS" = "success" ] || { echo "::error::offline-guards did not succeed"; exit 1; }
          [ "$COMPILE_PLATFORM" = "success" ] || { echo "::error::compile-platform did not succeed"; exit 1; }
          [ "$COMPILE" = "success" ] || { echo "::error::compile did not succeed"; exit 1; }
          [ "$TEST_BUILD" = "success" ] || { echo "::error::test-build did not succeed"; exit 1; }
          [ "$TEST_SHARDS" = "success" ] || { echo "::error::test-shards did not succeed"; exit 1; }
          [ "$TEST_COVERAGE" = "success" ] || { echo "::error::test-coverage did not succeed"; exit 1; }
          [ "$TEST" = "success" ] || { echo "::error::test did not succeed"; exit 1; }
          [ "$FORMULA" = "success" ] || { echo "::error::formula did not succeed"; exit 1; }
