name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package
    runs-on: macos-15-intel
    timeout-minutes: 45
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate tag
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not strict SemVer"
            exit 1
          fi

      - name: Use Command Line Tools
        run: |
          set -euo pipefail
          test -d /Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find swift
          uname -m
          sw_vers

      - name: Build release binary
        run: |
          set -euo pipefail
          bash Scripts/release-build-universal.sh
          git diff --exit-code Package.resolved
          test "$(./LogicProMCP --version)" = "${GITHUB_REF_NAME#v}"
          ./LogicProMCP --help >/dev/null

      - name: Package release
        env:
          LOGIC_PRO_MCP_PACKAGE_BINARY: LogicProMCP
        run: bash Scripts/release-package.sh

      - name: Validate archive layout
        run: bash Scripts/release-verify-formula-install-paths.sh

      - name: Create outer artifact manifest
        run: |
          set -euo pipefail
          shasum -a 256 \
            LogicProMCP \
            LogicProMCP-macOS-universal.tar.gz \
            LogicProMCP-macOS-arm64.tar.gz \
            RELEASE-METADATA.json \
            SHA256SUMS.txt > release-artifacts.sha256

      - name: Name artifact
        id: artifact-name
        run: echo "name=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            LogicProMCP
            LogicProMCP-macOS-universal.tar.gz
            LogicProMCP-macOS-arm64.tar.gz
            RELEASE-METADATA.json
            SHA256SUMS.txt
            release-artifacts.sha256

  validate-install:
    name: install-${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package.outputs.artifact-name }}
      - name: Verify and install exact archive
        env:
          LOGIC_PRO_MCP_VERSION: ${{ github.ref_name }}
          LOGIC_PRO_MCP_LOCAL_ARCHIVE: ${{ github.workspace }}/LogicProMCP-macOS-universal.tar.gz
          LOGIC_PRO_MCP_INSTALL_DIR: ${{ runner.temp }}/logic-pro-mcp/bin
          LOGIC_PRO_MCP_SHARE_DIR: ${{ runner.temp }}/logic-pro-mcp/share/logic-pro-mcp
          LOGIC_PRO_MCP_SKIP_SUDO: '1'
          LOGIC_PRO_MCP_REGISTER_CLAUDE: '0'
          LOGIC_PRO_MCP_INSTALL_KEYCMDS: '0'
        run: |
          set -euo pipefail
          shasum -a 256 -c release-artifacts.sha256
          export LOGIC_PRO_MCP_SHA256
          LOGIC_PRO_MCP_SHA256=$(awk '$2 == "LogicProMCP-macOS-universal.tar.gz" {print $1}' SHA256SUMS.txt)
          test -n "$LOGIC_PRO_MCP_SHA256"
          bash Scripts/install.sh
          test "$("$LOGIC_PRO_MCP_INSTALL_DIR/LogicProMCP" --version)" = "${GITHUB_REF_NAME#v}"
          "$LOGIC_PRO_MCP_INSTALL_DIR/LogicProMCP" --help >/dev/null
          test -f "$LOGIC_PRO_MCP_SHARE_DIR/logic_ui_jxa.py"

  publish:
    name: publish
    needs: [package, validate-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package.outputs.artifact-name }}
      - name: Reverify package
        run: shasum -a 256 -c release-artifacts.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            LogicProMCP
            LogicProMCP-macOS-universal.tar.gz
            LogicProMCP-macOS-arm64.tar.gz
            RELEASE-METADATA.json
            SHA256SUMS.txt

  verify-published:
    name: verify-published
    needs: [package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: verified
      - name: Published assets match the validated artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir published
          assets=(
            LogicProMCP
            LogicProMCP-macOS-universal.tar.gz
            LogicProMCP-macOS-arm64.tar.gz
            RELEASE-METADATA.json
            SHA256SUMS.txt
          )
          for asset in "${assets[@]}"; do
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              -o "published/$asset" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$asset"
            verified_hash=$(shasum -a 256 "verified/$asset" | awk '{print $1}')
            published_hash=$(shasum -a 256 "published/$asset" | awk '{print $1}')
            test "$verified_hash" = "$published_hash"
          done

  publish-registry:
    needs: verify-published
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
    with:
      version: ${{ github.ref_name }}
