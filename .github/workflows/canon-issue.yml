# An issue body states facts about Logic as often as a pull request does, and nothing read it.
#
# `docs/canon/README.md` said so plainly -- "the issue templates require it; nothing checks an
# issue mechanically yet" -- which made it an honest scope gap rather than a false claim, and
# Isaac's instruction named 이슈 등록 explicitly. This closes it.
#
# It COMMENTS rather than fails. An issue has no merge to block, and a red X on a bug report from
# an outside contributor is a way to lose the report. The note names what is missing and links the
# document; a maintainer decides.
#
# THE WORK IS IN Scripts/canon_issue_bot.py, NOT HERE
# ---------------------------------------------------
# This used to be a shell block that ran the checker, captured stdout and stderr together, and
# pasted whatever came back under a fixed sentence saying the issue states something about Logic
# without citing it. A corpus that would not load reached a contributor as that accusation, and
# every edit created another comment. None of that was testable from a workflow file: an `if`
# around a `gh issue comment` has no seam, so the only way to find out what it says to somebody is
# to have it say it to them.
#
# The decisions -- which category the result is, what the note says, whether to write at all, and
# which comment is ours -- are in a script with tests beside it. This file supplies the issue
# number and the token and nothing else.
name: Canon citations in issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  # Per issue, and `cancel-in-progress`, so a burst of edits settles into one run reading the
  # final body rather than several runs racing to comment about intermediate ones.
  group: canon-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  cite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `check-canon-citations.py` compares its waiver lists against `git merge-base`.
          fetch-depth: 0

      - name: The issue body cites Logic, or says it states no fact about Logic
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # The account the token above comments AS -- NOT `github.actor`, which is whoever opened
          # the issue. A note is only ours when the marker and this identity agree, so that a
          # contributor who pastes the marker into their own comment keeps their comment.
          CANON_BOT_LOGIN: github-actions[bot]
        run: python3 Scripts/canon_issue_bot.py
